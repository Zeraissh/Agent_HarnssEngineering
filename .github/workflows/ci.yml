name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

  desktop-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cross-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm test
      - run: npm run build
      # host:stage 会编译仓库根宿主；job 彼此隔离，不能借用 core 的 node_modules。
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run host:stage
      - run: node --check electron/main.cjs

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker build --tag agent-harness:ci .
      - name: OCI execution boundary escape/resource/cleanup canary
        run: |
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' agent-harness:ci)"
          RUNTIME="$(readlink -f "$(command -v docker)")"
          RUNTIME_SHA256="$(sha256sum "$RUNTIME" | awk '{print $1}')"
          test -n "$IMAGE_ID"
          test -x "$RUNTIME"
          AGENT_TEST_OCI_IMAGE="$IMAGE_ID" \
          AGENT_TEST_OCI_RUNTIME="$RUNTIME" \
          AGENT_TEST_OCI_RUNTIME_SHA256="$RUNTIME_SHA256" \
            npx vitest run test/execution-broker-oci.test.ts
