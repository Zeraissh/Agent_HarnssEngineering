services:
  harness:
    # 生产镜像由 release workflow（推 vX.Y.Z 标签触发）构建并推到 GHCR，
    # digest 记录在对应 GitHub Release 正文。部署与回滚都只改 AGENT_IMAGE：
    # 按 digest 固定引用（ghcr.io/<owner>/agent-harness@sha256:...），
    # 回滚 = 换回上一个 Release 记录的 digest 再 up。
    # 本地冒烟不走这份文件的构建：docker build -t agent-harness:local . 之后
    # AGENT_IMAGE=agent-harness:local 即可。
    image: ${AGENT_IMAGE:?set the digest-pinned release image from the GitHub Release notes}
    restart: unless-stopped
    stop_grace_period: 10s
    # 无轮转的 json-file 日志会无界增长直至盘满——盘满连带打断历史落盘，
    # 触发的正是自家 readiness 降级与 P0 告警（审计 2026-08-24 medium）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    init: true
    ports:
      - "127.0.0.1:${AGENT_UI_PORT:-4173}:4173"
    environment:
      AGENT_UI_ACCESS_TOKEN: ${AGENT_UI_ACCESS_TOKEN:?set a 32+ character access token}
      AGENT_UI_BEHIND_TLS_PROXY: "1"
      AGENT_UI_ALLOWED_ORIGINS: ${AGENT_UI_ALLOWED_ORIGINS:?set the public HTTPS origin}
      AGENT_UI_ENABLE_BASH: "0"
      AGENT_UI_MAX_ACTIVE_RUNS: ${AGENT_UI_MAX_ACTIVE_RUNS:-4}
      AGENT_UI_MAX_STORED_RUNS: ${AGENT_UI_MAX_STORED_RUNS:-100}
      AGENT_UI_MUTATIONS_PER_MINUTE: ${AGENT_UI_MUTATIONS_PER_MINUTE:-120}
      AGENT_UI_SSE_HEARTBEAT_MS: ${AGENT_UI_SSE_HEARTBEAT_MS:-15000}
      AGENT_TOTAL_MAX_TURNS: ${AGENT_TOTAL_MAX_TURNS:-120}
      AGENT_TOTAL_TOKEN_BUDGET: ${AGENT_TOTAL_TOKEN_BUDGET:-500000}
      AGENT_UI_DAILY_TOKEN_BUDGET: ${AGENT_UI_DAILY_TOKEN_BUDGET:-5000000}
      AGENT_UI_EXCLUSIVE_WORKDIR: ${AGENT_UI_EXCLUSIVE_WORKDIR:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-4-8}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}
    volumes:
      - type: bind
        source: ${AGENT_WORKSPACE:?set an absolute workspace path}
        target: /workspace
      - harness-history:/data/history
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

  history-backup:
    image: ${AGENT_IMAGE:?set the digest-pinned release image from the GitHub Release notes}
    restart: unless-stopped
    init: true
    read_only: true
    command: ["node", "/app/dist/ui/history-backup.js"]
    environment:
      AGENT_RUN_HISTORY_DIR: /data/history
      AGENT_RUN_HISTORY_BACKUP_DIR: /data/backups
      AGENT_RUN_HISTORY_BACKUP_INTERVAL_MS: ${AGENT_RUN_HISTORY_BACKUP_INTERVAL_MS:-3600000}
    volumes:
      - harness-history:/data/history:ro
      - type: bind
        source: ${AGENT_HISTORY_BACKUP_PATH:?set an absolute backup path outside the workspace/history volume}
        target: /data/backups
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs=require('fs');const p='/data/backups/.last-success.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));const max=Math.max(Number(process.env.AGENT_RUN_HISTORY_BACKUP_INTERVAL_MS||3600000)*2,120000);if(Date.now()-Date.parse(x.at)>max)process.exit(1)"
      interval: 5m
      timeout: 5s
      start_period: 2m
      retries: 3

volumes:
  harness-history:
