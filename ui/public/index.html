<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harness — Web UI</title>
<link rel="stylesheet" href="/vendor/phosphor/style.css">
<link rel="stylesheet" href="/styles.css">
<script>
// 主题在样式表生效前就定下来，否则从 localStorage 恢复暗色时会先闪一帧亮色。
// auto 不写 data-theme，交给 prefers-color-scheme；其余主题在首帧前显式恢复。
(function () {
  try {
    var t = localStorage.getItem("agent-ui-theme");
    if (["light", "dark", "graphite", "contrast"].indexOf(t) >= 0) {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) { /* 隐私模式下 localStorage 可能抛错，忽略即可 */ }
})();
</script>
</head>
<body>

<!-- 页面级标题：屏幕阅读器靠 h1 建立文档大纲与"跳到标题"导航；视觉上由侧栏/
     详情页头承担，故 sr-only 隐藏。必须包在 header（banner 地标）里——裸 h1
     游离于所有地标之外会触发 axe region 规则（页面内容须归属地标） -->
<header class="sr-only">
  <h1>Agent Harness 控制台</h1>
</header>

<!-- 侧栏：项目 → 对话 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-brand-mark" aria-hidden="true"><i class="ph ph-circles-four"></i></span>
      <span class="sidebar-brand-copy">
        <strong>Harness</strong>
        <span>项目与对话</span>
      </span>
    </div>
    <!-- 通知中心入口（T4）：铃铛 + 待决定未读角标。按钮在静态骨架里，
         面板与行为由 features/notifications.js 初始化时挂载。 -->
    <button type="button" class="icon-btn notifications-btn" id="notifications-btn"
      aria-label="通知中心" aria-haspopup="dialog" aria-expanded="false">
      <i class="ph ph-bell" aria-hidden="true"></i>
      <span class="notifications-badge" id="notifications-badge" hidden>0</span>
    </button>
    <!-- 记忆面板入口（T5）：按钮在静态骨架里，
         面板与行为由 features/memory-panel.js 初始化时挂载。 -->
    <button type="button" class="icon-btn memory-btn" id="memory-btn"
      aria-label="记忆" aria-haspopup="dialog" aria-expanded="false">
      <i class="ph ph-brain" aria-hidden="true"></i>
    </button>
    <div class="theme-picker" id="theme-picker">
      <button type="button" class="theme-toggle icon-btn" id="theme-toggle"
        aria-label="选择配色主题" aria-haspopup="menu" aria-expanded="false">
        <i class="ph ph-circle-half" aria-hidden="true"></i>
      </button>
      <div class="theme-menu" id="theme-menu" role="menu" aria-label="配色主题" hidden>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="auto">
          <i class="ph ph-circle-half" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>跟随系统</strong><small>自动匹配设备</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="light">
          <i class="ph ph-sun" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>暖纸</strong><small>低眩光浅色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="dark">
          <i class="ph ph-moon" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>暖炭</strong><small>温暖深色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="graphite">
          <i class="ph ph-stack" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>石墨</strong><small>中性深色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="contrast">
          <i class="ph ph-circle-half-tilt" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>高对比</strong><small>更强文字与边界</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="sidebar-search">
    <button type="button" class="palette-open-btn" id="palette-open-btn" aria-label="打开命令面板（Ctrl+K）">
      <i class="ph ph-command" aria-hidden="true"></i>
      <span>命令面板</span>
      <kbd class="palette-kbd" aria-hidden="true">⌘K</kbd>
    </button>
    <!-- 指挥中心入口（T11）：点击走 hash 路由 #/board，由 features/command-center.js 绑定 -->
    <button type="button" class="palette-open-btn" id="board-open-btn" aria-label="打开指挥中心">
      <i class="ph ph-squares-four" aria-hidden="true"></i>
      <span>指挥中心</span>
    </button>
    <button type="button" class="btn btn--primary new-chat-btn" id="new-chat-btn">
      <i class="ph ph-plus" aria-hidden="true"></i>
      <span>新建对话</span>
    </button>
    <div class="run-search-field">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <label for="run-search" class="sr-only">搜索对话</label>
      <input type="search" id="run-search" class="run-search" placeholder="搜索对话…" autocomplete="off" />
    </div>
    <div class="sidebar-filter-row">
      <span class="sidebar-section-label">对话</span>
      <!-- R-08 状态筛选 -->
      <select class="run-filter" id="run-filter" aria-label="按状态筛选对话">
        <option value="all">全部</option>
        <option value="running">运行中</option>
        <option value="done">已完成</option>
        <option value="failed">未通过</option>
      </select>
    </div>
  </div>
  <!-- role=listbox / aria-label 由 renderRunList 动态挂载：listbox 必须含 option
       子项（aria-required-children），空态/加载态若静态带着 role 反而是 critical
       违规——这条是 axe 扫描器上线首跑抓到的（s3d 手工修复引入的新问题） -->
  <div id="run-list" class="run-list">
    <div class="run-list-empty">加载中…</div>
  </div>
  <!-- 设置中心入口（T7）：按钮在静态骨架里，视图与行为由 features/settings.js
       初始化时挂载；点击走 hash 路由 #/settings。
       定时任务入口（T9）同理：#/schedules。 -->
  <div class="sidebar-footer">
    <button type="button" class="settings-open-btn" id="schedules-open-btn" aria-label="打开定时任务">
      <i class="ph ph-clock" aria-hidden="true"></i>
      <span>定时任务</span>
    </button>
    <button type="button" class="settings-open-btn" id="settings-open-btn" aria-label="打开设置">
      <i class="ph ph-gear" aria-hidden="true"></i>
      <span>设置</span>
    </button>
  </div>
</aside>

<!-- 主区 -->
<main class="main" id="main-panel">
  <!-- R-05: aria-live 状态播报区域 -->
  <div id="status-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- 传输层状态条：断线只提示，不改运行状态、不作废挂起审批（V-05） -->
  <div id="reconnect-banner" class="reconnect-banner" role="status" hidden>
    连接中断，正在重连…（运行仍在服务端继续）
  </div>

  <!-- 内容区 -->
  <div id="main-area" class="content-area">
    <div class="empty-state empty-state--welcome">
      <div class="empty-icon" aria-hidden="true"><i class="ph ph-chat-centered-dots"></i></div>
      <span class="empty-eyebrow">HARNESS WORKSPACE</span>
      <h2>从一个明确目标开始</h2>
      <p>选择左侧对话继续工作，或新建一次受工作目录约束的任务。</p>
    </div>
  </div>
  <!-- 跳转箭头：**在滚动容器之外**，所以它自己不会被滚走。
       ↓ 回到底部（流式时往上翻过之后用），↑ 回到四决定因素（读进下钻面之后用）。 -->
  <div id="scroll-nav" class="scroll-nav">
    <button type="button" class="scroll-nav-btn" data-nav="top" hidden aria-label="回到四决定因素"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
    <button type="button" class="scroll-nav-btn" data-nav="bottom" hidden aria-label="回到最新"><i class="ph ph-arrow-down" aria-hidden="true"></i></button>
  </div>

  <!-- 需你决定：钉在输入框正上方，**在滚动容器之外**。
       它不随内容滚走——这正是委托方那条反馈的结构解法。 -->
  <div id="action-dock" class="action-dock" hidden></div>

  <!-- 提交栏：**在底部**，且**一个框两种去向**（都来自委托方反馈）。
       在底部的理由不只是习惯：待办钉在输入框上方 = 固定可见位置，新审批出现在
       哪都看得见，从结构上消掉了"内容变高把待办推出视野"那个问题。
       共用一个框的理由：分开纯粹是实现遗留（一个打 /api/runs、一个打 /messages），
       对用户来说它们长得一样、位置也挨着。选中一个可续跑的运行 → 「继续对话」，
       没选中 → 「运行任务」；文案、placeholder、说明行、data-mode 四处一起变。
       派生逻辑在 app.js 的 deriveComposerMode / patchComposer 里（因此可测）。 -->
  <form id="submit-form" class="submit-bar" autocomplete="off">
    <div class="composer-scopebar" id="composer-scopebar">
      <div class="scope-field scope-field--workdir">
        <i class="ph ph-folder-simple" aria-hidden="true"></i>
        <label for="workdir-select">工作目录</label>
        <select id="workdir-select"></select>
      </div>
      <div class="role-models" id="role-models-knob">
        <span class="composer-caption" id="role-models-label">角色模型</span>
        <div class="role-toggles" role="group" aria-labelledby="role-models-label">
          <span class="role-model-pill" id="executor-role-row">
            <i class="ph ph-terminal" aria-hidden="true"></i>
            <span id="executor-role-text">执行 · 加载中</span>
          </span>
          <label class="role-model-pill role-model-pill--toggle" id="planner-role-row" hidden>
            <input type="checkbox" id="use-planner-model" checked />
            <span id="planner-role-text"></span>
          </label>
          <span class="role-model-pill role-model-pill--muted" id="planner-role-fallback">
            <i class="ph ph-tree-structure" aria-hidden="true"></i>
            <span>规划 · 跟随执行</span>
          </span>
          <label class="role-model-pill role-model-pill--toggle" id="verifier-role-row" hidden>
            <input type="checkbox" id="use-verifier-model" checked />
            <span id="verifier-role-text"></span>
          </label>
          <span class="role-model-pill role-model-pill--muted" id="verifier-role-fallback">
            <i class="ph ph-check-circle" aria-hidden="true"></i>
            <span>核查 · 跟随执行</span>
          </span>
          <span class="role-model-pill role-model-pill--muted" id="vision-role-row">
            <i class="ph ph-image" aria-hidden="true"></i>
            <span id="vision-role-text">识图 · 未配置</span>
          </span>
        </div>
        <span class="sr-only" id="role-models-hint"></span>
      </div>
      <button type="button" class="btn btn--ghost knobs-toggle" id="knobs-toggle" aria-expanded="false" aria-controls="run-knobs">
        <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
        <span class="knobs-label">运行设置</span>
        <i class="ph ph-caret-down knobs-caret" aria-hidden="true"></i>
      </button>
    </div>
    <!-- 信息队列：运行中收到的排队消息以 chips 呈现在输入行上方；
         内容全部由 message_queued / message_queue_updated 事件重放长出（renderQueueChips）。
         不能放进 .composer-input-row——它是 flex 行，chips 会被挤成内联一员 -->
    <div id="queue-chips" class="queue-chips" hidden></div>
    <div class="composer-input-row">
    <!-- 文案由 patchComposer 按模式改写（「任务描述」↔「追加指令」）。
         for/id 不许动：整页 axe 与文案闸门都钉着这一对。 -->
    <label for="task-input" class="task-label">任务描述</label>
    <textarea id="task-input" placeholder="输入新任务描述…（Ctrl+Enter 发送）" rows="1"></textarea>
    <!-- input **排在 label 之前**：它是 sr-only（宽高 1px + clip），焦点环会被
         整个裁掉，键盘用户 Tab 到附件时屏幕上没有任何反应。把它放前面，
         就能用最朴素的相邻兄弟选择器把环画到那个可见的 label 上
         （#file-upload:focus-visible + .upload-label）。 -->
    <input type="file" id="file-upload" class="sr-only" multiple />
    <label class="btn btn--ghost upload-label" for="file-upload" title="添加图片或文件">
      <i class="ph ph-paperclip" aria-hidden="true"></i>
      <span>附件</span>
    </label>
    <!-- 信息队列：运行中亮出的两个动作（patchComposer 按模式显隐）。
         主按钮此时是「停止」——三个键各司其职，互不兼任。 -->
    <button type="button" class="btn btn--ghost queue-action" id="steer-btn" hidden>
      <i class="ph ph-lightning" aria-hidden="true"></i>
      <span>插队重想</span>
    </button>
    <button type="button" class="btn btn--ghost queue-action" id="queue-btn" hidden>
      <i class="ph ph-queue" aria-hidden="true"></i>
      <span>排队等待</span>
    </button>
    <button type="submit" class="btn btn--primary submit-btn" id="submit-btn">
      <span id="submit-btn-label">运行任务</span>
      <i class="ph ph-paper-plane-right" aria-hidden="true"></i>
    </button>
    </div>
    <div class="composer-quickbar">
      <label class="checkbox-label verify-toggle-label">
        <input type="checkbox" id="verify-toggle" />
        <span>独立核查</span>
      </label>
      <label class="checkbox-label auto-approve-label">
        <input type="checkbox" id="auto-approve-toggle" checked />
        <span>自动放行工具</span>
      </label>
      <label class="effort-field" for="effort-select">
        <span>思考强度</span>
        <select id="effort-select" title="控制模型想多深，不是 token 上限">
          <option value="">默认</option>
        </select>
      </label>
      <span class="composer-quick-hint"><i class="ph ph-shield-check" aria-hidden="true"></i> 写入仍受工作目录边界约束</span>
      <!-- 上下文圆环：钉在提交栏右下角；面板向上展开，避免被视口裁切 -->
      <div class="ctx-ring-wrap ctx-ring-wrap--composer" id="ctx-ring-wrap">
        <button type="button" class="ctx-ring" id="ctx-ring" hidden
          aria-expanded="false" aria-controls="ctx-usage-panel" title="上下文用量">
          <svg class="ctx-ring-svg" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="ctx-ring-track" cx="18" cy="18" r="15.5" fill="none" stroke-width="3" />
            <circle class="ctx-ring-arc" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"
              stroke-dasharray="0 100" stroke-linecap="round" transform="rotate(-90 18 18)" />
          </svg>
          <span class="sr-only ctx-ring-label">上下文</span>
        </button>
        <div class="ctx-usage-panel" id="ctx-usage-panel" hidden></div>
      </div>
    </div>
    <!-- 模式说明。独立于 #submit-error：后者是 role="alert"，
         "这次提交会去哪儿"不是错误，不该被当成警报播报 -->
    <p id="composer-note" class="composer-note knob-hint" hidden></p>
    <div id="budget-extend-row" class="budget-extend-row" hidden>
      <button type="button" id="budget-extend-btn" class="btn btn--ghost">
        <i class="ph ph-plus-circle" aria-hidden="true"></i>
        <span>追加预算继续本对话</span>
      </button>
      <span class="knob-hint">当场给谱系加一段 token 跑道，不必改环境变量或重启宿主</span>
    </div>
    <!-- 瞬态操作错误：当前这次操作失败的反馈，可关闭；
         它只是控制器状态（newRunError/followUpErrors），不进事件流，
         历史重放不会让它复活 -->
    <p id="submit-error" class="inline-error" role="alert" hidden>
      <span id="submit-error-text" class="inline-error-text"></span>
      <button type="button" id="submit-error-close" class="btn btn--ghost inline-error-close" aria-label="关闭提示">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </p>
    <ul id="upload-list" class="upload-list" hidden></ul>

    <!-- V-24：harness 的旋钮此前只能靠重启换环境变量。默认折叠，不打扰
         "填个任务就跑"的主路径 -->
    <div class="run-knobs" id="run-knobs" hidden>
      <div class="knob">
        <label for="pack-select">领域包</label>
        <select id="pack-select">
          <option value="">（不用领域包）</option>
        </select>
      </div>
      <div class="knob">
        <label for="plan-mode-toggle">计划模式</label>
        <label class="knob-check">
          <input type="checkbox" id="plan-mode-toggle" />
          确认门（拆解后等人批）
        </label>
        <span class="knob-hint" id="mode-hint">每一轮都可选。开 = planner 出图后等你批准再跑</span>
      </div>
      <div class="knob">
        <label for="multi-agent-toggle">多 agent</label>
        <label class="knob-check">
          <input type="checkbox" id="multi-agent-toggle" />
          并行子任务（auto，最多 3）
        </label>
        <span class="knob-hint">每一轮都可选。与计划模式正交：可只开多 agent（自动批、无确认门）</span>
      </div>
      <div class="knob knob--wide">
        <label for="rubric-input">主观评分表</label>
        <textarea id="rubric-input" rows="2" placeholder="逐条列出评分项，核查者按表评估进 advisory——不影响 passed，也不触发返工"></textarea>
      </div>
    </div>
  </form>

</main>

<script type="module" src="/app.js"></script>
<script type="module">
/**
 * Harness Web UI — 主控制器（浏览器端入口）。
 * 连接 DOM 渲染与纯 reducer，管理 SSE 订阅与 HTTP 调用。
 * 阶段二新增：标签页切换、日志折叠、筛选器、无障碍语义。
 */
import {
  createBatcher,
  normalizeTab,
  createInitialState,
  reduceEvent,
  reduceEvents,
  markApprovalResolved,
  expirePendingApprovals,
  deriveLogEntries,
  applyCollapseOverrides,
  nextCollapseOverride,
  deriveRunListItems,
  deriveThreadFiles,
  deriveSessionFiles,
  conversationChainIds,
  ancestorRunIds,
  filterRunsByStatus,
  filterRunsByQuery,
  conversationTipId,
  renderRunList,
  renderRunDetail,
  renderEmptyState,
  deriveComposerMode,
  composerSubmitPlan,
  buildNewRunRequest,
  buildFollowUpRequest,
  mergeForkedFollowUp,
  patchComposer,
  renderQueueChips,
  shouldShowReconnecting,
  deriveScrollNav,
  paceReveal,
  revealedWindow,
  foldLiveDelta,
} from "/app.js";
import {
  loadSettings,
  saveSettings,
  updateSettings,
  migrateLegacyPrefs,
  composerDefaults,
  applyComposerDefaults,
  isSettingsRoute,
  SETTINGS_HASH,
  initSettingsView,
} from "/features/settings.js";
import {
  isSchedulesRoute,
  SCHEDULES_HASH,
  initSchedulesView,
} from "/features/schedules.js";
import {
  parseArtifactRoute,
  encodeArtifactHash,
  initArtifactCanvas,
} from "/features/artifact-canvas.js";
import {
  initFilePreview,
  initFileIntake,
  buildFilePreviewUrl,
} from "/features/file-preview.js";
import {
  WORKDIR_ADD_VALUE,
  renderWorkdirOptions,
  wireWorkdirSelect,
  initWorkdirPicker,
} from "/features/workdir-picker.js";
import {
  isCommandCenterRoute,
  COMMAND_CENTER_HASH,
  initCommandCenterView,
} from "/features/command-center.js";

// ---- 状态 ----
/** @type {Map<string, import('/app.js').RunState>} */
const runStates = new Map();
let selectedRunId = /** @type {string|null} */ (null);
let runs = /** @type {{runId:string, task:string, status:string, verify:boolean, createdAt:number, finishedAt:number|null}[]} */ ([]);
let eventSources = /** @type {Map<string, EventSource>} */ (new Map());

/** 通知中心（T4）实例，由文件末尾的动态 import 赋值；未加载时为 null，所有调用点可选链 */
let notificationsApi = /** @type {null|{ ingest:(runId:string, sseEvent:any)=>void, syncRuns:()=>void, removeRun:(runId:string)=>void }} */ (null);

/**
 * 设置中心（T7）。settingsApi 由文件末尾初始化；uiSettings 是「运行默认值」
 * 与 composer 启动态的同源出处——composer 的三个控件（思考强度/独立核查/
 * 自动放行）启动时读它，当次改动不回写（除了自动放行，见下方 change 处理器）。
 */

function currentRunArtifacts(runId) {
  const state = runStates.get(runId);
  if (!state) return [];
  const thread = deriveThreadFiles(runs, runStates, runId);
  return thread.length ? thread : deriveSessionFiles(state);
}

/** 打开画布：走 hash 路由，浏览器前进/后退天然可用 */
function openArtifactByIndex(runId, index) {
  if (!runId || currentRunArtifacts(runId).length === 0) return;
  enteredCanvasFromApp = true;
  const target = encodeArtifactHash(runId, index);
  if (location.hash === target) {
    artifactCanvasApi?.open(index);
    return;
  }
  location.hash = target;
}

/** 产物卡入口：按路径定位到清单序号 */
function openArtifactByPath(runId, path) {
  const index = currentRunArtifacts(runId).findIndex((a) => a.path === path);
  if (index < 0) {
    announceStatus("找不到该产物");
    return;
  }
  openArtifactByIndex(runId, index);
}

/** 深链/切换落点：数据够了就开，不够就留着 pending 等下一次渲染 */
function openPendingArtifact() {
  if (!pendingArtifact) return;
  const { runId, index } = pendingArtifact;
  if (runId !== selectedRunId) return;
  if (currentRunArtifacts(runId).length === 0) return;
  if (artifactCanvasApi?.open(index)) pendingArtifact = null;
}

/**
 * 跳转箭头的接线。
 *
 * 判据在 app.js 的 `deriveScrollNav`（纯函数，可测）；这里只负责量几何、
 * 按结果切显隐、以及点下去真的滚过去。
 *
 * 监听挂在滚动容器上而不是逐次渲染时算：人**只滚动不产生新事件**的那段时间
 * 里箭头也得跟着变，靠渲染驱动就会迟一步或干脆不动。
 */
function syncScrollNav() {
  const scroller = document.getElementById("main-area");
  const nav = document.getElementById("scroll-nav");
  if (!scroller || !nav) return;
  const drawer = document.getElementById("detail-drawer");
  const grid = document.querySelector(".factor-grid");
  const nvis = deriveScrollNav({
    scrollTop: scroller.scrollTop,
    scrollHeight: scroller.scrollHeight,
    clientHeight: scroller.clientHeight,
    // 四张卡相对滚动容器的位置：<0 就是已经滚出上边界
    anchorTop: grid ? grid.getBoundingClientRect().top - scroller.getBoundingClientRect().top : null,
    drawerOpen: Boolean(drawer && drawer.open),
  });
  nav.querySelector('[data-nav="top"]').hidden = !nvis.showTop;
  nav.querySelector('[data-nav="bottom"]').hidden = !nvis.showBottom;
}

/**
 * 空态的示例任务：点一下**填进输入框**，不直接开跑。
 *
 * 让人看清自己要提交什么再按，是这个 harness 一贯的做法——
 * 同一条纪律在计划确认门、审批门上各出现过一次。
 * 用事件委托绑在 #main-area 上：空态会被重渲染，逐次绑会漏也会重。
 */
(function bindExamples() {
  const area = document.getElementById("main-area");
  if (!area) return;
  area.addEventListener("click", (e) => {
    const btn = e.target.closest?.("[data-example]");
    if (!btn) return;
    taskInput.value = btn.getAttribute("data-example");
    taskInput.focus();
    // 光标放到末尾，人可以直接接着改
    taskInput.setSelectionRange(taskInput.value.length, taskInput.value.length);
  });
})();

(function bindScrollNav() {
  const scroller = document.getElementById("main-area");
  const nav = document.getElementById("scroll-nav");
  if (!scroller || !nav) return;
  scroller.addEventListener("scroll", syncScrollNav, { passive: true });
  // 抽屉开合会改变可滚高度与四张卡的位置，也得重算
  document.addEventListener("toggle", syncScrollNav, true);
  nav.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-nav]");
    if (!btn) return;
    /**
     * **落点用直接赋值，平滑交给 CSS 的 `scroll-behavior`。**
     *
     * 不在 JS 里写 `behavior:"smooth"`：那样"要不要动画"这件事就散在两处
     * （JS 一处、CSS 一处），而 `prefers-reduced-motion` 只管得住 CSS 那处。
     * 现在 JS 只负责"滚到哪"，动不动画由样式表统一决定——
     * **动效可以降级，落点不能。**
     *
     * 附一条自动化验证的边界（省得下一个人重复踩）：本项目的浏览器自动化面板
     * 不合成画面，**任何带动画的滚动在那里都不会推进**（scrollTop 停在原地且
     * 不报错），所以验证落点必须临时把 `scroll-behavior` 置成 auto 再量。
     * 我第一次就是没意识到这点，差点把它当成产品缺陷记下来。
     */
    if (btn.getAttribute("data-nav") === "bottom") {
      scroller.scrollTop = scroller.scrollHeight;
    } else {
      const grid = document.querySelector(".factor-grid");
      if (grid) {
        scroller.scrollTop +=
          grid.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      }
    }
    syncScrollNav();
  });
})();

async function deleteConversation(runId) {
  if (!runId) return;
  const ok = window.confirm("删除这条对话？档案一并去掉，不能恢复。");
  if (!ok) return;
  const ids = conversationChainIds(runs, runId);
  for (const id of ids) {
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok && res.status !== 404) {
        const body = await res.json().catch(() => ({}));
        showSubmitError(body.error ?? `删除失败（HTTP ${res.status}）`);
        return;
      }
    } catch (err) {
      showSubmitError(`删除失败：${err.message ?? "网络错误"}`);
      return;
    }
  }
}

// ---- 选择运行 ----
function selectRun(runId) {
  if (selectedRunId === runId) return;
  selectedRunId = runId;
  unreadRuns.delete(runId); // 看了就算读过
  refreshRunListView();

  // 拆成两件事：确保有 state、确保有订阅。旧实现在"已有 state"时直接 return，
  // 于是一个断过线的 run 被重新打开时永远不会重新订阅，界面就此定格。
  const state = ensureState(runId);
  if (!state) return;
  syncConnectionBanner();
  hydrateThreadAncestors(runId);
  renderDetailWithState(state);
  enterDetailMode();
  writeHash(runId, activeTabs.get(runId));
  announceStatus(`已选择运行：${state.task}`);
  ensureSubscription(runId);
  syncAutoApprove(runId);
}

/** 谱系上的父 run 也要有事件流，对话才能按收官形态拼出来。 */
function hydrateThreadAncestors(tipId) {
  for (const id of ancestorRunIds(runs, tipId)) {
    if (id === tipId) continue;
    const st = ensureState(id);
    if (!st) continue;
    if ((st.timeline?.length ?? 0) === 0) ensureSubscription(id);
  }
}

function ensureState(runId) {
  const existing = runStates.get(runId);
  const info = runs.find((r) => r.runId === runId);
  if (existing) {
    if (info && existing.archived !== Boolean(info.archived)) {
      const refreshed = { ...existing, archived: Boolean(info.archived) };
      runStates.set(runId, refreshed);
      return refreshed;
    }
    return existing;
  }
  if (!info) return null;
  const state = createInitialState(runId, info.task, info.verify, { archived: Boolean(info.archived) });
  runStates.set(runId, state);
  return state;
}

// 零依赖，不引路由库。
let suppressHashHandling = false;

function writeHash(runId, tab) {
  const next = runId ? `#/run/${runId}/${tab || "loop"}` : "#/";
  if (location.hash === next) return;
  suppressHashHandling = true;
  location.hash = next;
  // 程序化导航离开设置/定时任务/产物画布/指挥中心视图（writeHash 抑制了 hashchange，applyHash 不会替我们关）
  settingsApi?.close();
  schedulesApi?.close();
  boardApi?.close();
  artifactCanvasApi?.close();
  pendingArtifact = null;
  // hashchange 是异步派发的，标志位要等它跑完再清
  setTimeout(() => { suppressHashHandling = false; }, 0);
}

/**
 * 六路路由：设置视图 / 定时任务视图 / 指挥中心 / 产物画布 / 会话详情 / 主视图。
 * 设置路由的判定与 features/settings.js 的 isSettingsRoute 共用一条，不各写一份。
 * 定时任务路由同理（features/schedules.js 的 isSchedulesRoute）。
 * 指挥中心同理（features/command-center.js 的 isCommandCenterRoute）。
 * 产物画布（features/artifact-canvas.js 的 parseArtifactRoute）必须先于通用
 * `#/run/<id>/<tab>` 判定——否则 "artifact/3" 会被 normalizeTab 吞成 loop。
 */
function parseRoute() {
  if (isSettingsRoute(location.hash || "")) return { kind: "settings" };
  if (isSchedulesRoute(location.hash || "")) return { kind: "schedules" };
  if (isCommandCenterRoute(location.hash || "")) return { kind: "board" };
  const artifact = parseArtifactRoute(location.hash || "");
  if (artifact) return { kind: "artifact", runId: artifact.runId, index: artifact.index };
  const m = /^#\/run\/([^/]+)(?:\/([^/?]+))?/.exec(location.hash || "");
  if (!m) return { kind: "home" };
  return { kind: "run", runId: decodeURIComponent(m[1]), tab: normalizeTab(m[2]) };
}

/** 进入设置视图：走 hash，浏览器前进/后退天然可用 */
function navigateToSettings() {
  enteredSettingsFromApp = true;
  if (isSettingsRoute(location.hash || "")) {
    settingsApi?.open();
    return;
  }
  location.hash = SETTINGS_HASH;
}

/** 进入定时任务视图：与设置视图同一条 hash 路由纪律 */
function navigateToSchedules() {
  enteredSchedulesFromApp = true;
  if (isSchedulesRoute(location.hash || "")) {
    schedulesApi?.open();
    return;
  }
  location.hash = SCHEDULES_HASH;
}

/** 设置视图的「返回」：应用内进入 → 历史后退到来处；深链直达 → 回主视图 */
function closeSettingsRoute() {
  if (enteredSettingsFromApp && history.length > 1) {
    history.back();
    return;
  }
  location.hash = "#/";
}

/** 定时任务视图的「返回」：同设置视图 */
function closeSchedulesRoute() {
  if (enteredSchedulesFromApp && history.length > 1) {
    history.back();
    return;
  }
  location.hash = "#/";
}

/** 进入指挥中心视图：与设置视图同一条 hash 路由纪律 */
function navigateToBoard() {
  enteredBoardFromApp = true;
  if (isCommandCenterRoute(location.hash || "")) {
    boardApi?.open();
    return;
  }
  location.hash = COMMAND_CENTER_HASH;
}

/** 指挥中心视图的「返回」：同设置视图 */
function closeBoardRoute() {
  if (enteredBoardFromApp && history.length > 1) {
    history.back();
    return;
  }
  location.hash = "#/";
}

function applyHash() {
  const route = parseRoute();
  if (route.kind === "settings") {
    schedulesApi?.close();
    boardApi?.close();
    settingsApi?.open();
    return;
  }
  if (route.kind === "schedules") {
    settingsApi?.close();
    boardApi?.close();
    schedulesApi?.open();
    return;
  }
  if (route.kind === "board") {
    settingsApi?.close();
    schedulesApi?.close();
    artifactCanvasApi?.close();
    pendingArtifact = null;
    boardApi?.open();
    return;
  }
  settingsApi?.close();
  schedulesApi?.close();
  boardApi?.close();
  if (route.kind === "artifact") {
    // 产物画布深链：先确保会话选中（selectRun 的 writeHash 会盖掉深链，随后恢复），
    // 产物清单就位后 openPendingArtifact 补开；state 还没流到产物时挂账等渲染。
    pendingArtifact = { runId: route.runId, index: route.index };
    if (route.runId !== selectedRunId) {
      selectRun(route.runId);
      const target = encodeArtifactHash(route.runId, route.index);
      if (location.hash !== target) {
        suppressHashHandling = true;
        location.hash = target;
        setTimeout(() => { suppressHashHandling = false; }, 0);
      }
    }
    openPendingArtifact();
    return;
  }
  artifactCanvasApi?.close();
  pendingArtifact = null;
  enteredCanvasFromApp = false;
  enteredSettingsFromApp = false;
  enteredSchedulesFromApp = false;
  enteredBoardFromApp = false;
  if (route.kind === "home") {
    if (selectedRunId) backToList();
    return;
  }
  activeTabs.set(route.runId, route.tab);
  if (route.runId !== selectedRunId) {
    selectRun(route.runId);
  } else {
    const state = runStates.get(route.runId);
    if (state) renderDetailWithState(state);
  }
}

window.addEventListener("hashchange", () => {
  if (suppressHashHandling) return;
  applyHash();
});

// ---- 日志折叠切换 (R-04) ----
function handleToggleEntry(seq) {
  if (!selectedRunId) return;
  const state = runStates.get(selectedRunId);
  if (!state) return;
  let overrides = logCollapseOverrides.get(selectedRunId);
  if (!overrides) {
    overrides = new Map();
    logCollapseOverrides.set(selectedRunId, overrides);
  }
  // 翻转交给纯函数：它会**先把默认折叠态算进来**。此前这里是直接对覆盖表
  // 取反，而表里没有这一条时取反得到 true，多数条目默认本来就是 true——
  // 于是第一次点一条默认折叠的条目等于把 true 写成 true，
  // 一次完全没有反馈的死点击（AC2-18 复验抓到）
  const next = nextCollapseOverride(deriveLogEntries(state), overrides, seq);
  if (next === null) return;
  overrides.set(seq, next);
  renderDetailWithState(state);
}

// ---- 渲染详情（统一入口） ----
function renderDetailWithState(state) {
  const runId = state.runId;
  const activeTab = normalizeTab(activeTabs.get(runId));

  // 构建日志条目（应用折叠覆盖）
  // 与 handleToggleEntry 共用同一个应用函数——两处各写一份就会漂
  const logEntries = applyCollapseOverrides(
    deriveLogEntries(state),
    logCollapseOverrides.get(runId),
  );

  renderRunDetail(state, {
    showBack: isNarrow(),
    onBack: backToList,
    onAllow: (approvalId) => postApproval(runId, approvalId, "allow"),
    onAllowAlways: (approvalId) => postApproval(runId, approvalId, "allow", undefined, "conversation"),
    onDenyReason: (approvalId, reason) =>
      postApproval(runId, approvalId, "deny", reason || ""),
    activeTab,
    logEntries,
    onToggleEntry: handleToggleEntry,
    harness: harnessSnapshot,
    liveText: revealedSlice(runId, liveTexts.get(runId) ?? "", false),
    liveThinking: revealedSlice(runId, liveThinking.get(runId) ?? "", true),
    onPlanDecision: (decision) => postPlanDecision(runId, decision),
    onAnswer: (answers) => postAnswer(runId, answers),
    onReveal: (path) => revealArtifact(runId, path),
    onOpenCanvas: (path) => openArtifactByPath(runId, path),
    onPreviewPath: (path) => previewLocalPath(runId, path),
    inspectPaths: (paths) => inspectRunPaths(runId, paths),
    unverifiedDismissed: dismissedUnverified.has(runId),
    onDismissUnverified: () => {
      dismissedUnverified.add(runId);
      const next = runStates.get(runId);
      if (next) renderDetailWithState(next);
    },
    onContinue: () => {
      const text = taskInput.value.trim() || "继续";
      void submitAppend({ runId, text });
    },
    threadFiles: deriveThreadFiles(runs, runStates, runId),
    runs,
    runStates,
  });
  // T8 变更审查：详情骨架换 run 会整体重建，把分区节点搬回新的 rail-body
  // 并指向当前 run（同一节点 re-parent，加载态与展开态不丢）
  if (changesApi) {
    const railBody = document.querySelector("#main-area .rail-body");
    if (railBody) changesApi.mount(railBody);
    changesApi.setRun(runId);
  }
  syncChangesCommand();
  // T12 阅读模式：对话渲染落定后做后处理（聚焦模式藏过程元素、插摘要行；
  // 完整模式即现状）。与 changes-panel 同一挂账时机，骨架重建时开关 re-parent。
  if (readingModeApi) {
    readingModeApi.update(
      document.querySelector("#main-area .back-bar"),
      document.querySelector("#main-area #conversation"),
    );
  }
  // T10 产物画布：深链直达时 state 可能此刻才流到产物——补开挂账的画布；
  // 命令随产物有无注册/注销（产物是流式到达的，不能只挂选中态）
  openPendingArtifact();
  syncArtifactCommand();
  // 本地 SSE 把状态推到 done 时列表未必同步刷新过——底栏要立刻从「运行中」
  // 变回「继续对话」，否则用户盯着一个死按钮等
  if (runId === selectedRunId) syncComposer();
  syncScrollNav();
}

/**
 * 切换 Loop 面的读法。对话视图的正文按需拉——会话可达数 MB，没必要在
 * 用户根本没点开它的时候付这笔代价。
 */
function switchLoopView(runId, view) {
  loopViews.set(runId, view === "chat" ? "chat" : "events");
  const state = runStates.get(runId);
  if (state) renderDetailWithState(state);
  if (view === "chat" && !transcripts.has(runId)) void loadTranscript(runId);
}

async function loadTranscript(runId) {
  try {
    const res = await fetch(`/api/runs/${runId}/transcript`);
    if (!res.ok) return;
    transcripts.set(runId, await res.json());
    const state = runStates.get(runId);
    if (state && selectedRunId === runId) renderDetailWithState(state);
  } catch {
    // 拉不到就保持"正在载入会话…"，不伪造内容
  }
}

// run 结束时会话才落盘：若用户正停在对话视图上，收尾后自动补一次
function refreshTranscriptIfWatching(runId) {
  if (loopViews.get(runId) !== "chat") return;
  transcripts.delete(runId);
  void loadTranscript(runId);
}

/**
 * 底栏 composer 与当前选中态对齐。
 *
 * 这是**唯一**改写底栏 DOM 的入口——模式派生（deriveComposerMode）和 DOM
 * 应用（patchComposer）都在 app.js 里，所以"按钮该写什么、能不能点"这件事
 * 第一次变成可测的；这里只负责喂它当前的四个事实。
 *
 * 服务端算好的 canContinue 仍是权威（V-28：不能让用户点了才吃 409），
 * 只是现在"不能追加"不再表现为"没有输入框"，而是同一个框换个去向 + 说明原因。
 */
/** 人已经按了停止、run 还没落到 done。用来立刻改按钮，避免「点了像没点」。 */
const stoppingRuns = new Set();
/** 本页关掉的待复核条，按 run。刷新后还会再出现——那是新会话该看见的提醒。 */
const dismissedUnverified = new Set();

function syncComposer() {
  const info = selectedRunId ? runs.find((r) => r.runId === selectedRunId) ?? null : null;
  if (info?.status === "done" && selectedRunId) stoppingRuns.delete(selectedRunId);
  composerMode = deriveComposerMode({
    info: info ? { ...info, runId: selectedRunId } : null,
    localStatus: selectedRunId ? runStates.get(selectedRunId)?.status ?? null : null,
    submitting,
    stopping: Boolean(selectedRunId && stoppingRuns.has(selectedRunId)),
    // 错误按 run 隔离：否则 run A 的 409 会原样挂在切过去的 run B 头上
    // 刚发生的错误压过 run 上挂着的旧错；两者都按各自的时机清，
    // 所以切到另一个 run 时不会看见上一个 run 的 409
    error: newRunError ?? (selectedRunId ? followUpErrors.get(selectedRunId) ?? null : null),
  });
  patchComposer(composerMode);
  syncQueueChips();
}

// ---- 信息队列（运行中插队 / 排队）----
/**
 * 排队 chips 与事件重放同步。数据唯一来源是 runStates 里的 queuedMessages
 * （由 message_queued / message_queue_updated 长出）——这里不做任何本地增删，
 * 取消成功也以服务端推回的 message_queue_updated 为准，两处事实永不打架。
 */
function syncQueueChips() {
  const state = selectedRunId ? runStates.get(selectedRunId) : null;
  const html = renderQueueChips(state?.queuedMessages ?? []);
  queueChips.innerHTML = html;
  queueChips.hidden = !html;
}

/**
 * 运行中发消息：插队（下一轮模型调用前注入正史）或排队（本轮结束自动续跑）。
 * 服务端 202 = 已受理；消息何时生效由随后推来的 steering / user_message 事件宣告。
 */
async function postRunningMessage(qMode) {
  const runId = composerMode?.runId;
  const text = taskInput.value.trim();
  if (!runId) return;
  if (!text) {
    announceStatus("先输入指令内容再发送");
    return;
  }
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, mode: qMode }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showSubmitError(b.error ?? `发送失败（HTTP ${res.status}）`);
      return;
    }
    taskInput.value = "";
    clearUploads();
    announceStatus(qMode === "steer" ? "已插队，将在下一轮模型调用前生效" : "已排队，本轮结束后自动发送");
  } catch (err) {
    showSubmitError(`发送失败：${err.message ?? "网络错误"}`);
  }
}

steerBtn.addEventListener("click", () => void postRunningMessage("steer"));
queueBtn.addEventListener("click", () => void postRunningMessage("queue"));

/** chips 的 ✕：取消单条排队消息（事件委托，chip 每次同步都会重建） */
queueChips.addEventListener("click", (e) => {
  const btn = /** @type {HTMLElement|null} */ (e.target)?.closest?.(".queue-chip-cancel");
  if (!btn || !selectedRunId) return;
  void cancelQueuedMessage(selectedRunId, Number(btn.dataset.index));
});

async function cancelQueuedMessage(runId, index) {
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/queue`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showSubmitError(b.error ?? `取消失败（HTTP ${res.status}）`);
    }
    // 成功路径不本地改 chips：等服务端 message_queue_updated 推回来（唯一事实源）
  } catch (err) {
    showSubmitError(`取消失败：${err.message ?? "网络错误"}`);
  }
}

async function postFollowUp(runId, text, verify) {
  followUpErrors.delete(runId);
  try {
    const res = await fetch(`/api/runs/${runId}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // verify 是本轮的核查开关（会话中心化：核查逐轮可选，缺省沿用上一轮）
      body: JSON.stringify(buildFollowUpRequest({
        text,
        verify,
        autoApprove: autoApproveToggle?.checked !== false,
        planMode: planModeToggle?.checked === true,
        multiAgent: multiAgentToggle?.checked === true,
        effort: effortSelect?.value,
      })),
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const b = await res.json();
        if (b?.error) detail = b.error;
      } catch { /* 非 JSON 响应体，保留状态码 */ }
      followUpErrors.set(runId, detail);
      const st = runStates.get(runId);
      if (st) renderDetailWithState(st);
      return;
    }
    const payload = await res.json().catch(() => ({ runId }));
    const nextRunId = typeof payload.runId === "string" ? payload.runId : runId;

    // 归档续跑返回的是派生子 run。父档案必须继续保持 done/只读，不能沿用
    // live 续跑那条“把原 run 改回 running”的本地乐观更新。
    const fork = mergeForkedFollowUp(runs, runId, payload, text);
    if (fork) {
      runs = fork.runs;
      const merged = fork.summary;

      if (!runStates.has(fork.targetRunId)) {
        runStates.set(fork.targetRunId, createInitialState(fork.targetRunId, merged.task, Boolean(merged.verify)));
      }
      activeTabs.set(fork.targetRunId, "loop");
      refreshRunListView();
      selectRun(fork.targetRunId);
      ensureSubscription(fork.targetRunId);
      announceStatus("对话已接续");
      return;
    }

    // run 从终态回到运行中：本地先置位再重订阅。事件流里的 user_message 会
    // 把状态坐实，reduceEvents 的 seq 闸门保证重放不产生重复条目
    const st = runStates.get(runId);
    if (st) runStates.set(runId, { ...st, status: "running", runEnd: null });
    const info = runs.find((r) => r.runId === runId);
    if (info) Object.assign(info, payload.run ?? {}, { status: "running" });
    transcripts.delete(runId);
    refreshRunListView();
    ensureSubscription(runId);
    syncAutoApprove(runId);
    const cur = runStates.get(runId);
    if (cur) renderDetailWithState(cur);
  } catch (err) {
    followUpErrors.set(runId, `追加失败：${err.message ?? "网络错误"}`);
    const st = runStates.get(runId);
    if (st) renderDetailWithState(st);
  }
}

/**
 * 在系统文件管理器里选中一件产物。
 *
 * 路径原样交给宿主——圈禁在服务端做（同一套 resolveInWorkdir，与写类工具
 * 共用判据）。前端不做校验不是偷懒：前端的校验对攻击者不存在，
 * 判据放在唯一说了算的地方。
 */
async function revealArtifact(runId, path) {
  if (!path) return;
  try {
    const res = await fetch(`/api/runs/${runId}/reveal`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showSubmitError(b.error ?? `打开失败（HTTP ${res.status}）`);
    }
  } catch (err) {
    showSubmitError(`打开失败：${err.message ?? "网络错误"}`);
  }
}

/**
 * 只读确认模型正文里的路径候选。不存在/越界时宿主回 exists=false，前端不报错、
 * 不造链接；这不是一次用户操作，只是把“看起来像路径”变成“确实存在”的链接。
 */
async function inspectRunPaths(runId, paths) {
  const candidates = [...new Set((paths ?? []).map((p) => String(p ?? "").trim()).filter(Boolean))]
    .slice(0, 64);
  if (candidates.length === 0) return [];
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/paths/inspect`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paths: candidates }),
    });
    if (!res.ok) return [];
    const body = await res.json();
    return Array.isArray(body.paths) ? body.paths : [];
  } catch {
    return [];
  }
}

// ---- 宿主真相快照（Tools/Context/Loop 面的数据源）----
// 拉一次即可：它描述的是本次进程的装配，run 与 run 之间不变
let harnessSnapshot = null;
async function loadHarness() {
  try {
    const res = await fetch("/api/harness");
    if (!res.ok) return;
    harnessSnapshot = await res.json();
    populateKnobs(harnessSnapshot);
    // 快照到达前渲染过的详情要补一次——四决定因素的护栏/工具面全靠它
    if (selectedRunId) {
      const state = runStates.get(selectedRunId);
      if (state) renderDetailWithState(state);
    }
  } catch {
    // 拿不到就照实降级：Tools 面会显示"未获取到工具清单"
  }
}

// ---- SSE 订阅 ----
/**
 * 建立事件订阅。只在"尚无订阅 且 run 未终态"时建立——旧实现把这个判断和
 * "是否已有 state"混在 selectRun 里，导致重新打开一个断过线的 run 不会重订阅。
 */
// ---- 事件批处理（V-10）----
// 调度细节见 core/batch.js（含"隐藏标签页 rAF 不触发"那个坑的处理）
/**
 * 文本流式的接收端（backlog §4）。
 *
 * 服务端 R2 起就在推 `event: delta` 命名通道，前端一直丢弃——直播条显示的是
 * 上一条【完整】assistant_text，不是逐字。（AC2-06 那次真机跑，一次约 90 秒的
 * 运行流了 1133 条 delta，全被扔掉。）
 *
 * 它**不进 RunState**：delta 不占 seq、不进服务端事件缓冲（V-15 的设计），
 * 重连重放时根本不存在。放进 state 会打破 reducer 的重放幂等性。所以按
 * connectionStates 的同款办法，由控制器单独持有、渲染时作为参数传入。
 *
 * @type {Map<string, string>}
 */
const liveTexts = new Map();
/** 思考增量缓冲。与 liveTexts 同族（不进 RunState），但分开存——正文一来就清掉它 */
const liveThinking = new Map();
/**
 * 正文缓冲**不再截尾**（2026-09-04 委托方：超过约 2000 字就丢前面、只剩尾巴）。
 * 当年 LIVE_TEXT_CAP=2000 是为防长生成占内存；配合 revealedWindow 虽不冻屏，
 * 但可见内容仍是滑动窗口——正文被活生生砍头。正文全文进缓冲，内存远小于
 * 一次 run 的事件流；节拍器仍按 liveTotals 匀速放行。
 *
 * 思考缓冲同样**不截尾**（2026-09-07 委托方：点开思考后开头被删掉、只剩新文字）。
 * 「思考是瞬态所以可以砍头」的判断是错的——直播期间人正在读它。思考与正文
 * 两个缓冲都全文累加；截尾常量机制（LIVE_TEXT_CAP / LIVE_THINKING_CAP）整体退役。
 *（注意与 test/budget-extend.test.ts 的约定：正文截尾常量 LIVE_TEXT_CAP 已退役。）
 */
/** @type {Map<string, {think:number, text:number}>} */
const liveTotals = new Map();
const totalsOf = (runId) => liveTotals.get(runId) ?? { think: 0, text: 0 };

/**
 * delta 自己一个 batcher：它走的不是 reduce 那条路，但节流与"隐藏标签页
 * rAF 不触发"那个坑同样适用，所以复用同一个调度器实现而不是自己写节流。
 */
const deltaBatcher = createBatcher((batches) => {
  for (const [runId, chunks] of batches) {
    // 逐条按到达顺序折叠（reset 语义在 foldLiveDelta 里，判据只有一份）：
    // 同一批里 "半截增量 → reset → 重流增量" 也必须折出正确结果，不能按 kind 分组。
    let acc = {
      text: liveTexts.get(runId) ?? "",
      thinking: liveThinking.get(runId) ?? "",
      thinkTotal: totalsOf(runId).think,
      textTotal: totalsOf(runId).text,
    };
    let resetSeen = false;
    for (const chunk of chunks) {
      const next = foldLiveDelta(acc, chunk);
      resetSeen = resetSeen || next.reset;
      acc = { text: next.text, thinking: next.thinking, thinkTotal: next.thinkTotal, textTotal: next.textTotal };
    }
    if (acc.text) liveTexts.set(runId, acc.text); else liveTexts.delete(runId);
    if (acc.thinking) liveThinking.set(runId, acc.thinking); else liveThinking.delete(runId);
    liveTotals.set(runId, { think: acc.thinkTotal, text: acc.textTotal });
    if (resetSeen) {
      // 重流从第一个字重新开始：放行计数器跟着归零，并立刻重渲染一次——
      // 失败那次尝试的半截文字不能挂到下一帧（下一条 delta 要等一个重试退避）。
      revealed.delete(runId);
      const state = runStates.get(runId);
      if (state && selectedRunId === runId) renderDetailWithState(state);
    }
    if (selectedRunId !== runId) continue;
    startRevealTicker(runId);
  }
});

/**
 * 匀速放行的节拍器。
 *
 * 上游是一阵一阵来的（实测相邻两批最长静默 943ms），直接照搬到屏幕上就是
 * "卡一下、蹦一长串"。这里按帧把已到达的文本匀速放出去，判据在 app.js 的
 * `paceReveal`（纯函数，可测）。
 *
 * 追平之后**自动停表**——没有内容要放时还空转 rAF 是白烧电。
 */
const revealed = new Map();
/**
 * 节拍器**逐 run 一个**（原来是一个全局的）。
 *
 * 原实现 `if (revealTicker !== null) return` 加上闭包里捕获的 runId，会造成：
 * A 在流时选到 B，B 的节拍器起不来（被全局锁挡住），而 A 的那个还在按 A 跑——
 * 于是 B 的直播条一个字都不动。同一次排查里顺手修掉，因为它与 2000 字冻住
 * 是同一个函数的两处缺陷，分开修等于要再读一遍同一段代码。
 * @type {Map<string, number>}
 */
const revealTickers = new Map();

function startRevealTicker(runId) {
  if (revealTickers.has(runId)) return;
  let last = performance.now();
  const tick = (now) => {
    const dtMs = now - last;
    last = now;
    // 对**累计**计数而不是缓冲长度——缓冲会被上限钉死，累计不会
    const totals = totalsOf(runId);
    const arrived = totals.think + totals.text;
    const state = runStates.get(runId);
    const done = !state || state.status !== "running";
    const next = paceReveal({ arrived, revealed: revealed.get(runId) ?? 0, dtMs, done });
    const changed = next !== (revealed.get(runId) ?? 0);
    revealed.set(runId, next);
    if (changed && state && selectedRunId === runId) renderDetailWithState(state);
    // 追平且没在跑了就停表
    if (next >= arrived && done) {
      revealTickers.delete(runId);
      return;
    }
    revealTickers.set(runId, requestAnimationFrame(tick));
  };
  revealTickers.set(runId, requestAnimationFrame(tick));
}

/** 取"该显示到第几个字"的那一截。窗口换算是 app.js 的纯函数，这里只做接线 */
function revealedSlice(runId, full, isThinking) {
  const n = revealed.get(runId);
  if (n === undefined) return full;
  const totals = totalsOf(runId);
  return full.slice(
    0,
    revealedWindow({
      revealed: n,
      // 思考在前、正文在后：正文的额度要扣掉思考已经占掉的
      precedingTotal: isThinking ? 0 : totals.think,
      total: isThinking ? totals.think : totals.text,
      bufferLength: full.length,
    }),
  );
}

const batcher = createBatcher((batches) => {
  for (const [runId, queue] of batches) {
    const state = runStates.get(runId);
    if (!state) continue;

    // 通知中心（T4）：与 reducer 消费同一份信封，逐条喂给通知归约。
    // 模块未加载完成时静默跳过——它是增强项，不挡主流程。
    if (notificationsApi) {
      for (const item of queue) notificationsApi.ingest(runId, item);
    }
    // 指挥中心（T11）：同一节拍末尾刷新——它读的是通知 store 与 run 列表，
    // 必须在 notifications.ingest 之后调，待决栏才不吃上一节的旧账。
    boardApi?.refresh();

    // 文本阶段的边界：新一轮开始、模型转去调工具、或整段结束——
    // 三者都意味着"正在流入的那段文本"已经不是此刻在发生的事了，让位给
    // 工具标签/最终文本。不在 assistant_text 处清：那条只是把同一段文本
    // 完整地又给了一遍，清了会让直播条闪一下。
    //
    // api_retry / model_fallback 也在此清一次：reset 帧（delta 通道）是瞬态的，
    // 断线重连补缺口时它已经丢了，但这两条 durable 事件会随重放到达——
    // 不断线期残留在缓冲里的半截文字，全靠这一次清掉才不会和重流拼接。
    for (const item of queue) {
      const t = item?.event?.type;
      if (t === "turn_start" || t === "tool_call" || t === "done" || t === "api_retry" || t === "model_fallback") {
        liveTexts.delete(runId);
        liveThinking.delete(runId);
        liveTotals.delete(runId);
        revealed.delete(runId); // 换轮了，放行位置跟着归零
        break;
      }
    }

    const next = reduceEvents(state, queue);
    runStates.set(runId, next);

    if (selectedRunId === runId) renderDetailWithState(next);
    else if (selectedRunId && ancestorRunIds(runs, selectedRunId).includes(runId)) {
      const tip = runStates.get(selectedRunId);
      if (tip) renderDetailWithState(tip);
    }

    // run_end 是唯一的"可以收工"信号：此时主动 close，浏览器才不会再自动重连
    if (next.status === "done") {
      stoppingRuns.delete(runId);
      liveTexts.delete(runId); // 运行结束，直播条隐藏，缓冲没有留存意义
      liveThinking.delete(runId);
      liveTotals.delete(runId);
      const es = eventSources.get(runId);
      if (es) {
        es.close();
        eventSources.delete(runId);
        // 收尾前多半已经吃过一次 error（服务端 res.end 先到、run_end 后 flush），
        // 横幅正挂着。close 不触发任何事件，不在这儿落它就会一直挂到下次切换。
        setConnectionState(runId, "live");
        announceStatus(`运行已完成：${next.task}`);
        refreshTranscriptIfWatching(runId);
        // 不在看的那条跑完了 → 记一颗未读星（在看的那条不必提醒，你就在看）
        if (selectedRunId !== runId) unreadRuns.add(runId);
        // canContinue 由服务端算，run 收尾后要拉一次列表才知道能不能追加
        void loadRuns();
      }
    }
  }
});

const enqueueEvent = (runId, sseEvent) => batcher.push(runId, sseEvent);

// 切回前台时立刻补齐一次，不必等下一个节拍
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    batcher.flushNow();
    deltaBatcher.flushNow();
  }
});

function ensureSubscription(runId) {
  if (eventSources.has(runId)) return;
  const state = runStates.get(runId);
  // 空时间线的已完成父 run 仍要拉一次快照，否则谱系对话拼不出历史轮。
  if (state && state.status === "done" && (state.timeline?.length ?? 0) > 0) return;

  const es = new EventSource(`/api/runs/${runId}/events`);
  eventSources.set(runId, es);

  es.addEventListener("message", (msg) => {
    try {
      enqueueEvent(runId, JSON.parse(msg.data));
    } catch {
      // 解析失败静默
    }
  });

  // 文本流式：命名通道，不占 seq、不进事件缓冲（V-15）。
  // 只取 main 来源——verifier/planner 的思考流不该抢占委托方的直播条。
  es.addEventListener("delta", (msg) => {
    try {
      const { source, kind, text } = JSON.parse(msg.data);
      if (source !== "main") return;
      // reset：同轮重流（断流重试 / 换端点）前服务端宣告"清缓冲"——
      // 失败那次尝试流出的半截文字作废，否则重流全文会接在它后面反复生成
      if (kind === "reset") {
        deltaBatcher.push(runId, { kind: "reset", text: "" });
        return;
      }
      if (typeof text !== "string" || text === "") return;
      // 思考与正文分两路：混进一条直播条会前言不搭后语
      deltaBatcher.push(runId, { kind: kind === "thinking" ? "thinking" : "text", text });
    } catch {
      // 解析失败静默：直播条是锦上添花，不能因为一条坏帧影响主流程
    }
  });

  es.addEventListener("error", () => {
    // 关键：既不 close 也不把挂起审批标成过期。
    //   · close() 会掐死浏览器原生的自动重连（带 Last-Event-ID 续传）；
    //   · 把 pending 标 expired 更糟——一次网络抖动就让活着的审批卡消失，
    //     运行随即无人可应答而永久挂起。审批过期只由服务端 approval_expired 宣告。
    // 这里只反映"传输层断了"，不改 harness 事实。
    //
    // 但"断了"和"服务端正常收流了"在这一层长得一模一样（见 shouldShowReconnecting）——
    // 委托方截图里一个**已完成**的运行顶上就挂着这条横幅。所以先用 harness
    // 事实分辨一次，别把正常收尾报成故障。
    if (!shouldShowReconnecting({
      info: runs.find((r) => r.runId === runId) ?? null,
      localStatus: runStates.get(runId)?.status ?? null,
    })) {
      setConnectionState(runId, "live");
      return;
    }
    setConnectionState(runId, "reconnecting");
    loadRuns();
  });

  es.addEventListener("open", () => {
    setConnectionState(runId, "live");
  });
}

// ---- 连接态（控制器状态，不进 RunState：它是传输层的事，不是 harness 事实） ----
/** @type {Map<string, "live"|"reconnecting">} */
const connectionStates = new Map();

function setConnectionState(runId, next) {
  const prev = connectionStates.get(runId);
  if (prev === next) return;
  connectionStates.set(runId, next);
  if (selectedRunId !== runId) return;
  syncConnectionBanner();
  if (next === "reconnecting") announceStatus("连接中断，正在重连…");
}

/**
 * 横幅只反映**当前选中**那个运行的连接态。
 *
 * 必须能单独调：setConnectionState 在 `selectedRunId !== runId` 时只写 Map
 * 不动 DOM，所以切换运行时，上一个运行的横幅会原样挂在新运行头上。
 */
function syncConnectionBanner() {
  const banner = document.getElementById("reconnect-banner");
  if (!banner) return;
  banner.hidden = !(selectedRunId && connectionStates.get(selectedRunId) === "reconnecting");
}

// ---- 审批回调 ----
/**
 * @param {string} approvalId 形如 `toolUseId#requestSeq`——返工轮复用同一
 *   toolUseId，只有带请求序号才能指明是哪一轮的那张卡（V-03）。
 *   `#` 是 URL 片段分隔符，必须编码后再拼路径。
 */
/**
 * 计划确认门应答（§5.1）。与工具审批同款口径：409 静默（幂等），不做乐观更新
 * ——服务端随后推 `plan_approval_resolved`，那条才是权威审计记录。
 */
async function postPlanDecision(runId, decision) {
  try {
    const res = await fetch(`/api/runs/${runId}/plan-approval`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    if (res.status === 409) return; // 已决或已收尾——重复点击不该报错
    if (!res.ok) {
      showSubmitError(`计划门应答失败（HTTP ${res.status}）：${await res.text()}`);
    }
  } catch (err) {
    showSubmitError(`计划门应答失败：${err && err.message ? err.message : err}`);
  }
}

/**
 * §5.2 澄清答复。`answers === null` = 委托方明确表示"都让它自己定"——
 * 与超时同归未应答，但**来源不同**，服务端照实记（V-04：不把主动跳过写成没人答）。
 * 非 null 时逐题对齐（未答那题为 null），长度必须等于问题数。
 */
async function postAnswer(runId, answers) {
  try {
    const res = await fetch(`/api/runs/${runId}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(answers === null ? { skip: true } : { answers }),
    });
    if (res.status === 409) return; // 已答或已收尾——重复点击不该报错
    if (!res.ok) {
      showSubmitError(`澄清答复失败（HTTP ${res.status}）：${await res.text()}`);
    }
  } catch (err) {
    showSubmitError(`澄清答复失败：${err && err.message ? err.message : err}`);
  }
}

async function postApproval(runId, approvalId, decision, reason, scope) {
  try {
    const res = await fetch(
      `/api/runs/${runId}/approvals/${encodeURIComponent(approvalId)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // API 字段向后兼容；服务端实际只复用同一工具 + 规范化后完全相同参数
        body: JSON.stringify({ decision, reason, ...(scope ? { scope } : {}) }),
      },
    );
    if (res.status === 409 || res.status === 404) {
      // 409：服务端已决。404：自动放行从不进挂起表，卡却还在——同一张过期卡。
      // 两种都不该弹「审批失败」，按这次点击收口即可。
    } else if (!res.ok) {
      let detail = "";
      try {
        const body = await res.json();
        detail = body?.error ? `：${body.error}` : "";
      } catch { /* 响应体不是 JSON */ }
      showSubmitError(`审批失败（HTTP ${res.status}）${detail}`);
      return;
    }
    // 乐观更新，让点击立刻有反馈；服务端随后会推 approval_resolved，
    // 那条才是权威记录（刷新/换标签页后靠它复原，见 V-02）
    const state = runStates.get(runId);
    if (state) {
      const next = markApprovalResolved(
        state,
        approvalId,
        decision === "allow" ? "allowed" : "denied",
        reason,
      );
      runStates.set(runId, next);
      if (selectedRunId === runId) {
        renderDetailWithState(next);
      }
    }
  } catch (err) {
    showSubmitError(`审批失败：${err && err.message ? err.message : err}`);
  }
}

async function postAutoApprove(runId, enabled) {
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/auto-approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: Boolean(enabled) }),
    });
    if (res.ok) {
      const info = runs.find((r) => r.runId === runId);
      if (info) info.autoApprove = Boolean(enabled);
      return;
    }
    if (res.status !== 409) {
      const body = await res.json().catch(() => ({}));
      showSubmitError(body.error ?? `自动放行设置失败（HTTP ${res.status}）`);
    }
  } catch (err) {
    showSubmitError(`自动放行设置失败：${err && err.message ? err.message : err}`);
  }
}

/**
 * 勾选是偏好，不是 run 上的事实。归档续跑 / 已勾着从不触发 change 时，
 * 界面开着、服务端关着——必须在选中运行中对话时把两边对齐。
 */
function syncAutoApprove(runId) {
  const info = runs.find((r) => r.runId === runId);
  if (!info || info.status !== "running") return;
  const want = autoApproveToggle?.checked !== false;
  if (Boolean(info.autoApprove) === want) return;
  void postAutoApprove(runId, want);
}

/**
 * 自动放行默认值与设置中心同源（T7）：agent-ui-settings 为准，旧键
 * agent-ui-auto-approve 已在启动时由 migrateLegacyPrefs 一次性迁入。
 * 这里（composer 当次改动）与设置页两边都同时写两个键，任一顺序读都一致。
 */
const AUTO_APPROVE_PREF = "agent-ui-auto-approve";
if (autoApproveToggle) {
  autoApproveToggle.checked = composerDefaults(uiSettings).autoApprove;
  autoApproveToggle.addEventListener("change", () => {
    uiSettings = updateSettings(uiSettings, { defaults: { autoApprove: autoApproveToggle.checked } });
    try {
      localStorage.setItem(AUTO_APPROVE_PREF, autoApproveToggle.checked ? "1" : "0");
      saveSettings(localStorage, uiSettings);
    } catch { /* ignore */ }
    const run = runs.find((r) => r.runId === selectedRunId);
    if (run && run.status === "running") {
      void postAutoApprove(selectedRunId, autoApproveToggle.checked);
    }
  });
}
// 独立核查默认值同样来自设置中心（此前无持久化，设置页是它的唯一出处）
if (verifyToggle) {
  verifyToggle.checked = composerDefaults(uiSettings).verify;
}

// ---- 提交：一个框，两种去向 ----
/**
 * 提交入口。去哪儿由 `composerSubmitPlan` 说了算——它是纯函数，
 * 所以"这一下会新建还是会追加"这件事可以在测试里锁死，而不是靠人点。
 */
submitForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const plan = composerSubmitPlan(composerMode, taskInput.value);
  if (!plan) {
    // 不能提交时**不能静默**：运行中那个模式恰恰是主动邀请用户打字的
    // （placeholder 写着"可以先把下一条指令打好"），按了却零反馈最伤人
    if (composerMode && !composerMode.canSubmit && taskInput.value.trim()) {
      announceStatus(composerMode.note || "现在不能提交");
    }
    return;
  }
  if (plan.kind === "stop") void stopRun(plan.runId);
  else if (plan.kind === "append") void submitAppend(plan);
  else void submitNewRun(plan);
});

/**
 * 停止走按钮 click，不指望 form submit。
 * 嵌入预览 / 某些环境下 submit 会被吞，点了像没点；click 是人按下去的那一下。
 */
submitBtn.addEventListener("click", (e) => {
  if (composerMode?.kind !== "stop") return;
  e.preventDefault();
  e.stopPropagation();
  void stopRun(composerMode.runId);
});

/**
 * Ctrl/Cmd+Enter 发送。**只绑在 textarea 上，不绑在 form 上**——
 * `#rubric-input` 也在这个 form 里，绑 form 的话在评分表里按 Ctrl+Enter
 * 会带着半截 rubric 直接发车。单独 Enter 留给换行，多行指令是常态。
 */
taskInput.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  if (typeof submitForm.requestSubmit === "function") submitForm.requestSubmit();
  else submitForm.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
});

async function submitNewRun({ text: task }) {
  submitting = true;
  newRunError = null;
  syncComposer();
  try {
    const verify = verifyToggle.checked;
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildNewRunRequest({
        task,
        verify,
        pack: packSelect?.value,
        effort: effortSelect?.value,
        rubric: rubricInput?.value,
        planMode: planModeToggle?.checked === true,
        multiAgent: multiAgentToggle?.checked === true,
        lineageBudget: false,
        dailyBudget: false,
        askUser: true,
        autoApprove: autoApproveToggle?.checked !== false,
        workdir: workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
          ? workdirSelect.value
          : undefined,
        useVerifierModel: !useVerifierModel || useVerifierModel.checked,
        usePlannerModel: !usePlannerModel || usePlannerModel.checked,
      })),
    });
    if (!res.ok) {
      let detail = "";
      try {
        const body = await res.json();
        detail = body?.error ? `：${body.error}` : "";
      } catch { /* 响应体不是 JSON，只报状态码 */ }
      newRunError = `提交失败（HTTP ${res.status}）${detail}`;
      return;
    }
    const { runId } = await res.json();

    const state = createInitialState(runId, task, verify);
    runStates.set(runId, state);

    runs.unshift({ runId, task, status: "running", verify, createdAt: Date.now(), finishedAt: null });
    selectedRunId = runId;
    activeTabs.set(runId, "loop");
    renderDetailWithState(state);
    enterDetailMode();
    writeHash(runId, "loop");
    announceStatus(`新任务已提交：${task}`);

    ensureSubscription(runId);
    taskInput.value = "";
    clearUploads();
  } catch (err) {
    newRunError = `提交失败：${err.message ?? "网络错误"}`;
  } finally {
    submitting = false;
    // 焦点交还输入框：按钮这一刻会变成 disabled（运行中），鼠标用户的焦点
    // 否则当场掉回 body
    if (document.activeElement === submitBtn) taskInput.focus();
    refreshRunListView();
  }
}

/**
 * 停止这次运行。
 *
 * 闸立刻拉下，按钮立刻改成「正在停止…」。当前这一步（在飞的模型请求 /
 * 工具）要等它自己结束或被 SDK 掐断，然后循环才收尾——不是点下去画面马上空白。
 */
async function stopRun(runId) {
  if (!runId || stoppingRuns.has(runId)) return;
  stoppingRuns.add(runId);
  newRunError = null;
  syncComposer();
  announceStatus("正在停止这次运行");
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/stop`, { method: "POST" });
    if (res.ok) return;
    stoppingRuns.delete(runId);
    const b = await res.json().catch(() => ({}));
    if (res.status === 409 && /already finished/i.test(String(b.error ?? ""))) {
      void loadRuns();
      return;
    }
    showSubmitError(b.error ?? `停止失败（HTTP ${res.status}）`);
  } catch (err) {
    stoppingRuns.delete(runId);
    showSubmitError(`停止失败：${err.message ?? "网络错误"}`);
  } finally {
    syncComposer();
  }
}

async function submitAppend({ runId, text }) {
  submitting = true;
  // 提交前读：syncComposer 会把开关禁用，但 checked 值不动
  const verify = verifyToggle.checked;
  syncComposer();
  try {
    await postFollowUp(runId, text, verify);
    if (!followUpErrors.has(runId)) {
      taskInput.value = "";
      clearUploads();
    }
  } finally {
    submitting = false;
    if (document.activeElement === submitBtn) taskInput.focus();
    syncComposer();
  }
}

/**
 * 提交错误就地显示（V-16）。
 *
 * 此前用 alert()：它抢焦点、阻塞整页、在窄屏上盖住内容，而且屏幕阅读器
 * 的播报时机不受控。改成 role="alert" 的行内区域——辅助技术会自动播报，
 * 键盘焦点不动，错误内容还能带上 HTTP 状态码与服务端文案。
 */
function showSubmitError(message) {
  // 合并之后 #submit-error 由 patchComposer 统一写。这里改成设状态再同步，
  // 否则两个写入方会互相覆盖：一次列表刷新就能把刚报出来的错抹掉。
  newRunError = message || null;
  syncComposer();
}

/**
 * 行内错误的关闭按钮（委托方：红字错误出现后无法关闭，一直在原位）。
 *
 * 这个显示位共享给两本账：与 run 无关的提交错误（newRunError）和挂在当前
 * 选中 run 上的追加错误（followUpErrors）——关掉时两本都清，否则关掉一本
 * 另一本立刻顶上来，等于没关。
 *
 * 这些都是**当前操作失败**的瞬态提示：它们只是控制器状态，不进 SSE 事件流，
 * 刷新/重放不会复活——与事件流里的历史错误记录（tool_result isError 等）
 * 是两回事，后者是历史事实，不提供关闭。
 */
submitError.querySelector("#submit-error-close")?.addEventListener("click", () => {
  newRunError = null;
  if (selectedRunId) followUpErrors.delete(selectedRunId);
  syncComposer();
  // 按钮随容器一起 hidden 后焦点不能掉回 body——交还输入框（本仓既有纪律）
  taskInput.focus();
});

// ---- 全局生命周期流（V-10：取代 3 秒轮询）----
// 轮询本身不是问题，"每 3 秒整体重建侧栏"才是——实测焦点停在运行项上 3.6 秒后
// 就变成 BODY。改成推送 + 键控补丁：只在真有变化时更新，且不重建节点。
// 兜底轮询保留但降到 30 秒，且仅在推送流断开期间生效。
let lifecycleStream = null;
let fallbackPoll = null;

function startFallbackPoll() {
  if (fallbackPoll !== null) return;
  fallbackPoll = setInterval(loadRuns, 30000);
}

function stopFallbackPoll() {
  if (fallbackPoll === null) return;
  clearInterval(fallbackPoll);
  fallbackPoll = null;
}

function subscribeLifecycle() {
  lifecycleStream = new EventSource("/api/stream");

  lifecycleStream.addEventListener("message", (msg) => {
    try {
      const payload = JSON.parse(msg.data);
      if (payload.type === "snapshot") {
        runs = payload.runs;
      } else if (payload.type === "run_removed" && payload.runId) {
        runs = runs.filter((run) => run.runId !== payload.runId);
        unreadRuns.delete(payload.runId);
        runStates.delete(payload.runId);
        notificationsApi?.removeRun(payload.runId);
        const stream = eventSources.get(payload.runId);
        if (stream) stream.close();
        eventSources.delete(payload.runId);
        if (selectedRunId === payload.runId) {
          selectedRunId = null;
          writeHash(null, null);
        }
      } else if (payload.run) {
        const idx = runs.findIndex((r) => r.runId === payload.run.runId);
        // 生命周期流也要记未读：没订阅事件流的那些运行（你根本没点开过）
        // 只能从这里知道它们跑完了——只靠 SSE done 分支会漏掉一整类
        if (
          payload.run.status === "done" &&
          runs[idx]?.status === "running" &&
          payload.run.runId !== selectedRunId
        ) {
          unreadRuns.add(payload.run.runId);
        }
        if (idx >= 0) runs[idx] = payload.run;
        else runs = [payload.run, ...runs];
        if (payload.run.status === "done") stoppingRuns.delete(payload.run.runId);
      }
      refreshRunListView();
      if (selectedRunId) syncAutoApprove(selectedRunId);
      // 通知中心对账：running→done 跃迁补「运行完成」，已删除/已完成 run 清账
      notificationsApi?.syncRuns();
      // 指挥中心随生命周期流一起刷新（待决/运行中/最近完成三栏都依赖这份列表）
      boardApi?.refresh();
    } catch {
      // 解析失败静默
    }
  });

  lifecycleStream.addEventListener("open", stopFallbackPoll);
  // 不 close：浏览器会自己重连，届时服务端重发 snapshot 补齐缺口
  lifecycleStream.addEventListener("error", startFallbackPoll);
}

/** 用宿主快照填充旋钮选项——可选值由服务端给，前端不硬编码 */
function populateKnobs(snap) {
  if (packSelect && Array.isArray(snap.availablePacks)) {
    for (const p of snap.availablePacks) {
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.textContent = `${p.name} — ${p.description ?? ""}`;
      packSelect.appendChild(opt);
    }
    if (snap.pack?.name) packSelect.value = snap.pack.name;
    updatePackHint();
  }
  if (effortSelect && Array.isArray(snap.effortLevels)) {
    const labels = { low: "低", medium: "中", high: "高", xhigh: "很高", max: "最高" };
    for (const lv of snap.effortLevels) {
      const opt = document.createElement("option");
      opt.value = lv;
      opt.textContent = labels[lv] ?? lv;
      effortSelect.appendChild(opt);
    }
    if (snap.effort) effortSelect.value = snap.effort;
    // 设置中心（T7）的思考强度默认值覆盖服务端默认："" = 跟随服务端，不动 select
    applyComposerDefaults({ effortSelect }, { effort: composerDefaults(uiSettings).effort }, {
      effortLevels: snap.effortLevels,
    });
  }
  if (effortSelect && snap.compat) {
    effortSelect.title = "compat 端点不发送思考强度（第三方不认识该参数）";
  }

  // V-29 工作目录：列宿主声明过的集合，末项恒为「＋ 添加目录…」（哨兵值，
  // 选中即打开目录选择器浮层——见 features/workdir-picker.js）
  if (workdirSelect && Array.isArray(snap.availableWorkdirs)) {
    renderWorkdirOptions(workdirSelect, snap.availableWorkdirs, { selected: snap.workdir });
    // 有了「＋ 添加目录…」就永远有得选：不再因为只有一个目录而锁死下拉。
    // 运行中/追加模式的禁用走 patchComposer 的 optionsEnabled，语义不变。
    workdirSelect.disabled = false;
    workdirSelect.dataset.fixed = "false";
  }

  // V-30/V-31：四个角色都常驻可见。独立模型没配时明确写「跟随执行」或
  // 「未配置」，而不是把整块藏掉后让用户猜这次到底用了什么。
  const rm = snap.roleModels;
  const knob = document.getElementById("role-models-knob");
  if (rm && knob) {
    const executorText = document.getElementById("executor-role-text");
    if (executorText && rm.executor) {
      executorText.textContent = `执行 · ${rm.executor.model}`;
      executorText.parentElement.title = `${rm.executor.model}（${rm.executor.provider}）`;
    }

    const wire = (role, rowId, fallbackId, textId, label) => {
      const row = document.getElementById(rowId);
      const fallback = document.getElementById(fallbackId);
      const configured = Boolean(rm[role]?.configured);
      if (row) row.hidden = !configured;
      if (fallback) fallback.hidden = configured;
      if (!configured) return false;
      const text = document.getElementById(textId);
      if (text) text.textContent = `${label} · ${rm[role].model}`;
      row.title = `${label}使用 ${rm[role].model}（${rm[role].provider}）；取消勾选则跟随执行模型`;
      return true;
    };
    const anyVerifier = wire("verifier", "verifier-role-row", "verifier-role-fallback", "verifier-role-text", "核查");
    const anyPlanner = wire("planner", "planner-role-row", "planner-role-fallback", "planner-role-text", "规划");

    const visionRow = document.getElementById("vision-role-row");
    const visionText = document.getElementById("vision-role-text");
    if (visionRow && visionText) {
      const configured = Boolean(rm.vision?.configured);
      visionRow.classList.toggle("role-model-pill--muted", !configured);
      visionText.textContent = configured ? `识图 · ${rm.vision.model}` : "识图 · 未配置";
      visionRow.title = configured
        ? `图片由 ${rm.vision.model}（${rm.vision.provider}）通过 describe_image 工具处理`
        : "未配置视觉模型；图片仍可上传，但不提供 describe_image 工具";
    }

    const hint = document.getElementById("role-models-hint");
    if (hint) {
      // 有实测依据的才说"更好"：D2 支持强 verifier，B3 证伪了强 planner
      hint.textContent = anyVerifier
        ? "独立角色模型可逐次关闭；关闭后跟随执行模型。识图模型只作为工具接入。"
        : anyPlanner
          ? "独立角色模型可逐次关闭；关闭后跟随执行模型。"
          : "规划与核查跟随执行模型；识图模型独立作为工具接入。";
    }
  }
}

function updatePackHint() {

if (packSelect) packSelect.addEventListener("change", updatePackHint);

// 计划模式 / 多 agent：localStorage 记住偏好
const PREF_PLAN = "agent.ui.pref.planMode";
const PREF_MULTI = "agent.ui.pref.multiAgent";
function readPref(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v === null) return fallback;
    return v === "1" || v === "true";
  } catch {
    return fallback;
  }
}
function writePref(key, on) {
  try {
    localStorage.setItem(key, on ? "1" : "0");
  } catch { /* ignore */ }
}
if (planModeToggle) {
  planModeToggle.checked = readPref(PREF_PLAN, false);
  planModeToggle.addEventListener("change", () => {
    writePref(PREF_PLAN, planModeToggle.checked);

      hint.textContent = planModeToggle.checked
        ? "planner 出图后等人批准；可与多 agent 同时开"
        : "每一轮都可选。开 = planner 出图后等你批准再跑";
    }
  });
}
if (multiAgentToggle) {
  multiAgentToggle.checked = readPref(PREF_MULTI, false);
  multiAgentToggle.addEventListener("change", () => writePref(PREF_MULTI, multiAgentToggle.checked));
}

if (knobsToggle && runKnobs) {

  };

/**

/**
 * 附件上传（V-34）。
 *
 * 文件落进工作目录下的 uploads/，服务端返回**相对工作目录的路径**——那正是
 * agent 的工具能直接用的形式。上传完把路径追加进任务描述，模型才知道东西在
 * 哪；否则文件躺在磁盘上而它无从得知。
 *
 * 配了视觉模型时，图片可以直接让 describe_image 去看；没配的话上传仍然有用
 * （bash / read_file 处理文本与数据文件），只是看不了图。
 */
const uploaded = [];

function renderUploads() {
  if (!uploadList) return;
  uploadList.hidden = uploaded.length === 0;
  uploadList.innerHTML = uploaded
    .map((u, i) => {
      const name = escapeHtml(u.path);
      const size = `<span class="knob-hint">${(u.bytes / 1024).toFixed(0)} KB</span>`;
      // 预览按钮：上传返回的 absolutePath 直接喂 /api/file-preview（圈禁在服务端）
      const previewBtn =
        `<button type="button" class="btn btn--ghost upload-preview" data-upload-preview="${i}" ` +
        `title="预览" aria-label="预览 ${name}">` +
        `<i class="ph ph-eye" aria-hidden="true"></i><span>预览</span></button>`;
      if (u.previewUrl && /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.path)) {
        return (
          `<li class="upload-item upload-item--image">` +
          `<img class="upload-thumb" src="${escapeHtml(u.previewUrl)}" alt="" />` +
          `<div class="upload-meta"><code>${name}</code> ${size}</div>${previewBtn}</li>`
        );
      }
      return `<li class="upload-item"><code>${name}</code> ${size} ${previewBtn}</li>`;
    })
    .join("");
}

/**
 * 清单清空。合并之前这个数组**从来没被清过**——因为提交完页面重心就转走了，
 * 看不见。现在 composer 常驻底栏，不清的话上一次的附件清单会挂到下一次提交
 * 头上，一眼就能看出错。
 */
function clearUploads() {
  if (uploaded.length === 0) return;
  for (const u of uploaded) {
    if (u.previewUrl) URL.revokeObjectURL(u.previewUrl);
  }
  uploaded.length = 0;
  renderUploads();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

async function uploadFiles(files) {
  showSubmitError(null);
  /**
   * 附件落在**哪个工作目录**取决于这次提交去哪儿。
   *
   * 续跑复用原运行的 loop，工具的写入圈禁根是那个运行的 workdir；而
   * `#workdir-select` 反映的是"下一次新建"的选择（追加模式下它还被禁用了）。
   * 照旧取 select 的值，文件会落进另一个目录，agent 按路径读不到——
   * 而且不报错，只表现为"它说找不到文件"。
   */
  const at = { mode: composerMode?.mode ?? "new", runId: composerMode?.runId ?? null };
  const targetWorkdir = at.mode === "append" || at.mode === "fork"
    ? composerMode?.workdir
    : workdirSelect?.value;
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      // 大文件用 chunk 转 base64——一次性 apply 整个数组会爆调用栈
      let binary = "";
      const view = new Uint8Array(buf);
      for (let i = 0; i < view.length; i += 0x8000) {
        binary += String.fromCharCode(...view.subarray(i, i + 0x8000));
      }
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: file.name,
          data: btoa(binary),
          ...(targetWorkdir ? { workdir: targetWorkdir } : {}),
        }),
      });
      if (!res.ok) {
        const b = await res.json().catch(() => ({}));
        showSubmitError(b.error ?? `上传失败（HTTP ${res.status}）`);
        continue;
      }
      const info = await res.json();
      // 上传是 fire-and-forget（change 处理器不 await）。等它回来时用户可能
      // 已经切走了——那条路径属于另一个工作目录，写进现在的框里就是错配。
      if ((composerMode?.mode ?? "new") !== at.mode || (composerMode?.runId ?? null) !== at.runId) {
        showSubmitError(`附件已上传到原来的工作目录（${info.path}），但你已经切换了对话——没有写进输入框。`);
        continue;
      }
      uploaded.push({
        ...info,
        previewUrl: file.type.startsWith("image/") ? URL.createObjectURL(file) : null,
      });
      // 把路径写进任务描述——模型只有看到路径才知道文件存在
      const line = `附件：${info.path}`;
      taskInput.value = taskInput.value ? `${taskInput.value}
${line}` : line;
    } catch (err) {
      showSubmitError(`上传失败：${err.message ?? "未知错误"}`);
    }
  }
  renderUploads();
}

if (fileUpload) {
  fileUpload.addEventListener("change", () => {
    if (fileUpload.files?.length) void uploadFiles([...fileUpload.files]);
    fileUpload.value = "";
  });
}

// ---- 文件预览覆盖层 + 拖拽/粘贴上传（V-35）----
// 预览覆盖层：附件清单与对话里的本地路径链接共用一个壳；渲染主体在
// features/artifact-canvas.js（renderPreviewBody），取件走 /api/file-preview
// （圈禁在服务端）。覆盖层不进 hash 路由——它是瞬态的，刷新不该恢复。
let filePreviewApi = /** @type {null|{ open:(o:{path:string,url:string})=>boolean, close:()=>void, isOpen:()=>boolean, element:HTMLElement }} */ (null);
try {
  filePreviewApi = initFilePreview({
    onAnnounce: (msg) => announceStatus(msg),
  });
} catch { /* 文件预览是增强项，初始化失败静默降级 */ }

/** 附件清单的「预览」：上传响应里的 absolutePath 直接做取件路径（白名单内的绝对路径） */
function previewUploadedFile(u) {
  if (!filePreviewApi || !u) return;
  const url = buildFilePreviewUrl({ path: u.absolutePath ?? u.path });
  filePreviewApi.open({ path: u.path, url });
}

/**
 * 对话正文里本地路径链接的「预览」：hit.path 是**相对该 run 工作目录**的路径，
 * 取件时把 run 的 workdir 一起带上（圈禁判定在服务端）。
 */
function previewLocalPath(runId, path) {
  if (!filePreviewApi || !path) return;
  const run = runs.find((r) => r.runId === runId);
  const url = buildFilePreviewUrl({ path, workdir: run?.workdir ?? null });
  filePreviewApi.open({ path, url });
}

    if (!btn) return;

}

const budgetExtendBtn = /** @type {HTMLButtonElement|null} */ (document.getElementById("budget-extend-btn"));
if (budgetExtendBtn) {
  budgetExtendBtn.addEventListener("click", async () => {
    const runId = selectedRunId;
    if (!runId) return;
    budgetExtendBtn.disabled = true;
    showSubmitError(null);
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/extend-budget`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        showSubmitError(body.error ?? `追加预算失败（HTTP ${res.status}）`);
        return;
      }
      followUpErrors.delete(runId);
      // 刷新列表里的 canContinue / continuationBlockReason
      await loadRuns?.();
      syncComposer();
      announceStatus(
        body.after?.maxTokens
          ? `已追加预算：上限现为 ${body.after.maxTokens.toLocaleString()} tokens，可以继续对话`
          : "已追加预算，可以继续对话",
      );
    } catch (err) {
      showSubmitError(`追加预算失败：${err.message ?? "未知错误"}`);
    } finally {
      budgetExtendBtn.disabled = false;
    }
  });
}

// ---- 主题选择（V-20）----
// 主题超过三项后，单按钮盲循环已经无法预判“下一次会变成什么”。改成显式菜单：
// 用户先看名称与用途再选；选择仍写入 localStorage，并由 head 脚本首帧恢复。
const THEME_KEY = "agent-ui-theme";
const THEME_META = {
  auto: { label: "跟随系统", icon: "ph-circle-half" },
  light: { label: "暖纸", icon: "ph-sun" },
  dark: { label: "暖炭", icon: "ph-moon" },
  graphite: { label: "石墨", icon: "ph-stack" },
  contrast: { label: "高对比", icon: "ph-circle-half-tilt" },
};

function currentTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  return explicit && THEME_META[explicit] ? explicit : "auto";
}

function applyTheme(next) {
  const theme = THEME_META[next] ? next : "auto";
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  try {
    if (theme === "auto") localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, theme);
  } catch { /* 隐私模式下写入可能抛错，主题仍在本次会话内生效 */ }
  if (themeToggle) {
    const icon = themeToggle.querySelector("i");
    if (icon) icon.className = `ph ${THEME_META[theme].icon}`;
    themeToggle.setAttribute("aria-label", `选择配色主题（当前：${THEME_META[theme].label}）`);
  }
  for (const choice of themeChoices) {
    choice.setAttribute("aria-checked", String(choice.getAttribute("data-theme-choice") === theme));
  }
  // 设置视图若开着，主题 radio 跟着刷新（主题也可从侧栏菜单/命令面板改）
  settingsApi?.refresh?.();
}

function setThemeMenuOpen(open, focusSelected = false) {
  if (!themeMenu || !themeToggle) return;
  themeMenu.hidden = !open;
  themeToggle.setAttribute("aria-expanded", String(open));
  if (open && focusSelected) {
    const selected = /** @type {HTMLElement|null} */ (themeMenu.querySelector('[aria-checked="true"]'));
    const fallback = /** @type {HTMLElement|null} */ (themeMenu.querySelector("[data-theme-choice]"));
    (selected ?? fallback)?.focus();
  }
}

if (themeToggle) {
  applyTheme(currentTheme());
  themeToggle.addEventListener("click", () => {
    setThemeMenuOpen(themeToggle.getAttribute("aria-expanded") !== "true", true);
  });
}
if (themeMenu) {
  themeMenu.addEventListener("click", (event) => {
    const choice = event.target instanceof Element ? event.target.closest("[data-theme-choice]") : null;
    if (!choice) return;
    applyTheme(choice.getAttribute("data-theme-choice"));
    setThemeMenuOpen(false);
    themeToggle?.focus();
  });
  themeMenu.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      setThemeMenuOpen(false);
      themeToggle?.focus();
      return;
    }
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const at = Math.max(0, themeChoices.indexOf(/** @type {HTMLButtonElement} */ (document.activeElement)));
    const step = event.key === "ArrowDown" ? 1 : -1;
    themeChoices[(at + step + themeChoices.length) % themeChoices.length]?.focus();
  });
}
document.addEventListener("click", (event) => {
  if (themePicker && !themePicker.contains(event.target)) setThemeMenuOpen(false);
});
