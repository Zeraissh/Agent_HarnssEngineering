<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harness — Web UI</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- 页面级标题：屏幕阅读器靠 h1 建立文档大纲与"跳到标题"导航；视觉上由侧栏/
     详情页头承担，故 sr-only 隐藏。必须包在 header（banner 地标）里——裸 h1
     游离于所有地标之外会触发 axe region 规则（页面内容须归属地标） -->
<header class="sr-only">
  <h1>Agent Harness 控制台</h1>
</header>

<!-- 侧栏：运行列表 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>📋 运行列表</span>
    <!-- R-08 状态筛选 -->
    <select class="run-filter" id="run-filter" aria-label="按状态筛选运行">
      <option value="all">全部</option>
      <option value="running">运行中</option>
      <option value="done">已完成</option>
      <option value="failed">未通过</option>
    </select>
  </div>
  <!-- role=listbox / aria-label 由 renderRunList 动态挂载：listbox 必须含 option
       子项（aria-required-children），空态/加载态若静态带着 role 反而是 critical
       违规——这条是 axe 扫描器上线首跑抓到的（s3d 手工修复引入的新问题） -->
  <div id="run-list" class="run-list">
    <div class="run-list-empty">加载中…</div>
  </div>
</aside>

<!-- 主区 -->
<main class="main" id="main-panel">
  <!-- R-05: aria-live 状态播报区域 -->
  <div id="status-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- 提交栏 -->
  <form id="submit-form" class="submit-bar" autocomplete="off">
    <label for="task-input" class="task-label">任务描述</label>
    <textarea id="task-input" placeholder="输入任务描述…" rows="1"></textarea>
    <label class="checkbox-label">
      <input type="checkbox" id="verify-toggle" />
      <span>开启独立核查</span>
    </label>
    <button type="submit" class="btn btn--primary" id="submit-btn">运行任务</button>
  </form>

  <!-- 内容区 -->
  <div id="main-area" class="content-area">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>尚无运行。</p>
    </div>
  </div>
</main>

<script type="module" src="/app.js"></script>
<script type="module">
/**
 * Harness Web UI — 主控制器（浏览器端入口）。
 * 连接 DOM 渲染与纯 reducer，管理 SSE 订阅与 HTTP 调用。
 * 阶段二新增：标签页切换、日志折叠、筛选器、无障碍语义。
 */
import {
  createInitialState,
  reduceEvent,
  markApprovalResolved,
  expirePendingApprovals,
  deriveLogEntries,
  toggleEntryCollapsed,
  deriveRunListItems,
  filterRunsByStatus,
  renderRunList,
  renderRunDetail,
  renderEmptyState,
} from "/app.js";

// ---- 状态 ----
/** @type {Map<string, import('/app.js').RunState>} */
const runStates = new Map();
let selectedRunId = /** @type {string|null} */ (null);
let runs = /** @type {{runId:string, task:string, status:string, verify:boolean, createdAt:number, finishedAt:number|null}[]} */ ([]);
let eventSources = /** @type {Map<string, EventSource>} */ (new Map());

// R-03 标签页状态（每个 run 独立）
/** @type {Map<string, string>} */
const activeTabs = new Map();

// R-04 日志折叠状态（每个 run 独立的展开/折叠覆盖）
/** @type {Map<string, Map<number, boolean>>} */
const logCollapseOverrides = new Map();

// R-08 筛选器状态
let currentFilter = "all";

// ---- DOM 引用 ----
const submitForm = /** @type {HTMLFormElement} */ (document.getElementById("submit-form"));
const taskInput = /** @type {HTMLTextAreaElement} */ (document.getElementById("task-input"));
const verifyToggle = /** @type {HTMLInputElement} */ (document.getElementById("verify-toggle"));
const submitBtn = /** @type {HTMLButtonElement} */ (document.getElementById("submit-btn"));
const sidebar = /** @type {HTMLElement} */ (document.getElementById("sidebar"));
const mainPanel = /** @type {HTMLElement} */ (document.getElementById("main-panel"));
const runFilter = /** @type {HTMLSelectElement} */ (document.getElementById("run-filter"));
const statusAnnouncer = /** @type {HTMLElement} */ (document.getElementById("status-announcer"));

// ---- 响应式：窄屏视图状态 ----
const NARROW_BP = 700;
function isNarrow() {
  return window.innerWidth <= NARROW_BP;
}

function enterDetailMode() {
  if (isNarrow()) {
    sidebar.classList.add("narrow-hidden");
    mainPanel.classList.add("narrow-full");
  }
}

function exitDetailMode() {
  if (isNarrow()) {
    sidebar.classList.remove("narrow-hidden");
    mainPanel.classList.remove("narrow-full");
    selectedRunId = null;
    refreshRunListView();
    renderEmptyState(runs.length > 0);
  }
}

function backToList() {
  exitDetailMode();
}

/** R-05: 更新屏幕阅读器播报 */
function announceStatus(msg) {
  if (statusAnnouncer) {
    statusAnnouncer.textContent = msg;
  }
}

// ---- 运行列表刷新 ----
function getFilteredRuns() {
  return filterRunsByStatus(runs, runStates, currentFilter);
}

function refreshRunListView() {
  const filtered = getFilteredRuns();
  const metaMap = deriveRunListItems(filtered, runStates);
  renderRunList(filtered, selectedRunId, selectRun, metaMap);
  if (!selectedRunId) {
    renderEmptyState(runs.length > 0);
  }
}

async function loadRuns() {
  try {
    const res = await fetch("/api/runs");
    if (!res.ok) return;
    runs = await res.json();
    refreshRunListView();
  } catch {
    // 服务器未就绪时静默
  }
}

// ---- R-08 筛选器 ----
runFilter.addEventListener("change", () => {
  currentFilter = runFilter.value;
  refreshRunListView();
});

// ---- 选择运行 ----
function selectRun(runId) {
  if (selectedRunId === runId) return;
  selectedRunId = runId;
  refreshRunListView();

  const existing = runStates.get(runId);
  if (existing) {
    renderDetailWithState(existing);
    enterDetailMode();
    announceStatus(`已选择运行：${existing.task}`);
    return;
  }

  const info = runs.find((r) => r.runId === runId);
  if (!info) return;
  const state = createInitialState(runId, info.task, info.verify);
  runStates.set(runId, state);
  renderDetailWithState(state);
  enterDetailMode();
  announceStatus(`已选择运行：${info.task}`);
  subscribeSSE(runId);
}

// ---- 标签页切换 (R-03) ----
document.addEventListener("tab-switch", (e) => {
  const tab = /** @type {string} */ (/** @type {CustomEvent} */ (e).detail.tab);
  if (selectedRunId) {
    activeTabs.set(selectedRunId, tab);
    const state = runStates.get(selectedRunId);
    if (state) {
      renderDetailWithState(state);
      // 重渲染换掉了 DOM 节点：把焦点交还给新选中的标签，
      // 否则方向键切换一次后焦点掉回 body，键盘用户被踢出标签组
      const next = document.getElementById(`tab-${tab}`);
      if (next) next.focus();
    }
  }
});

// ---- 日志折叠切换 (R-04) ----
function handleToggleEntry(seq) {
  if (!selectedRunId) return;
  let overrides = logCollapseOverrides.get(selectedRunId);
  if (!overrides) {
    overrides = new Map();
    logCollapseOverrides.set(selectedRunId, overrides);
  }
  const current = overrides.get(seq);
  overrides.set(seq, !current); // toggle
  const state = runStates.get(selectedRunId);
  if (state) {
    renderDetailWithState(state);
  }
}

// ---- 渲染详情（统一入口） ----
function renderDetailWithState(state) {
  const runId = state.runId;
  const activeTab = activeTabs.get(runId) || "overview";

  // 构建日志条目（应用折叠覆盖）
  const baseEntries = deriveLogEntries(state);
  const overrides = logCollapseOverrides.get(runId);
  let logEntries = baseEntries;
  if (overrides) {
    logEntries = baseEntries.map((e) => {
      const ov = overrides.get(e.seq);
      return ov !== undefined ? { ...e, collapsed: ov } : e;
    });
  }

  renderRunDetail(state, {
    showBack: isNarrow(),
    onBack: backToList,
    onAllow: (toolUseId) => postApproval(runId, toolUseId, "allow"),
    onDenyReason: (toolUseId, reason) =>
      postApproval(runId, toolUseId, "deny", reason || ""),
    activeTab,
    logEntries,
    onToggleEntry: handleToggleEntry,
  });
}

// ---- SSE 订阅 ----
function subscribeSSE(runId) {
  if (eventSources.has(runId)) return;

  const es = new EventSource(`/api/runs/${runId}/events`);
  eventSources.set(runId, es);

  es.addEventListener("message", (msg) => {
    try {
      const sseEvent = JSON.parse(msg.data);
      const state = runStates.get(runId);
      if (!state) return;
      const next = reduceEvent(state, sseEvent);
      runStates.set(runId, next);

      if (selectedRunId === runId) {
        renderDetailWithState(next);
      }

      if (next.status === "done") {
        announceStatus(`运行已完成：${next.task}`);
        loadRuns();
      }
    } catch {
      // 解析失败静默
    }
  });

  es.addEventListener("error", () => {
    es.close();
    eventSources.delete(runId);
    const state = runStates.get(runId);
    if (state && state.status !== "done") {
      const expired = expirePendingApprovals(state);
      runStates.set(runId, expired);
      if (selectedRunId === runId) {
        renderDetailWithState(expired);
      }
    }
    loadRuns();
  });
}

// ---- 审批回调 ----
async function postApproval(runId, toolUseId, decision, reason) {
  try {
    const res = await fetch(`/api/runs/${runId}/approvals/${toolUseId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, reason }),
    });
    if (res.status === 409) return;
    if (!res.ok) return;
    const state = runStates.get(runId);
    if (state) {
      const next = markApprovalResolved(
        state,
        toolUseId,
        decision === "allow" ? "allowed" : "denied",
        reason,
      );
      runStates.set(runId, next);
      if (selectedRunId === runId) {
        renderDetailWithState(next);
      }
    }
  } catch {
    // 网络错误静默
  }
}

// ---- 提交任务 ----
submitForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const task = taskInput.value.trim();
  if (!task) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "提交中…";

  try {
    const verify = verifyToggle.checked;
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task, verify }),
    });
    if (!res.ok) {
      alert("提交失败");
      return;
    }
    const { runId } = await res.json();

    const state = createInitialState(runId, task, verify);
    runStates.set(runId, state);

    runs.unshift({ runId, task, status: "running", verify, createdAt: Date.now(), finishedAt: null });
    selectedRunId = runId;
    activeTabs.set(runId, "overview");
    refreshRunListView();
    renderDetailWithState(state);
    enterDetailMode();
    announceStatus(`新任务已提交：${task}`);

    subscribeSSE(runId);
    taskInput.value = "";
  } catch (err) {
    alert("提交失败：" + (err.message ?? "网络错误"));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "运行任务";
  }
});

// ---- 启动 ----
loadRuns();
setInterval(loadRuns, 3000);
</script>

</body>
</html>
